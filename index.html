function qrDuPhong(url,err){const quyen=/cấp quyền|capQuyenDocQR/.test(err||'');
  const m=modal('📱 Chưa đọc tự động được mã QR',`<p style="margin-top:0">${quyen?`Máy chủ chưa được cấp quyền đọc trang thông tin sách. <b>Quản trị viên</b> làm 1 lần trên máy tính: mở <b>Apps Script</b> → ô chọn hàm chọn <b>capQuyenDocQR</b> → bấm <b>▷ Chạy</b> → <b>Cho phép</b>. Sau đó quét lại là được (không cần triển khai lại).`:esc(err||'')}</p>
   <p>Trong lúc chờ, bạn có thể:</p><div class="acts"><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">🔗 Mở trang thông tin sách</a><button type="button" class="btn or" id="qdTay">✍ Nhập sách (đã điền NXB Giáo dục)</button></div>
   <p class="small muted" style="margin-bottom:0">Hoặc quét <b>mã vạch ISBN</b> (978…) ở bìa sau – cũng tự điền được thông tin.</p>`,{noOk:true,cancel:'Đóng'});
  $('#qdTay',m.root).onclick=()=>{m.close();qcSachMoi('',{nhanDe:'',tacGia:'',nxb:'Giáo dục Việt Nam',namXB:'',gia:'',moTa:''})}}
function qrToSach(q){return{nhanDe:q.nhanDe||'',tacGia:'',nxb:'Giáo dục Việt Nam',namXB:'',gia:q.gia||'',moTa:q.maSach?'Mã số sách: '+q.maSach+(q.soDKXB?' · Số ĐKXB: '+q.soDKXB:''):''}}
async function qcQR(url){if(!/^https?:\/\//i.test(url))return false;
  qcMsg('Đang đọc thông tin từ mã QR…',true);let q;try{q=await nxbgdInfo(url)}catch(e){qcMsg('Chưa đọc tự động được thông tin từ mã QR',false);qrDuPhong(url,e.message);return true}
  const isbn=String(q.isbn||'').replace(/[^0-9Xx]/g,'');const s=isbn?S.Sach.find(x=>isbnEq(x.isbn,isbn)):S.Sach.find(x=>norm(x.nhanDe)===norm(q.nhanDe));
  if(s){QC.nhapS=s.id;qcMsg('✔ Sách đã có: '+s.nhanDe,true);fillQC();return true}
  qcSachMoi(isbn||'(không có)',qrToSach(q));return true}

const C128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function enc128(txt){const s=String(txt??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\u0111/g,'d').replace(/\u0110/g,'D').replace(/[^\x20-\x7e]/g,'');const out=[];let set=null,i=0;
  const run=j=>{let k=j;while(k<s.length&&s.charCodeAt(k)>=48&&s.charCodeAt(k)<=57)k++;return k-j};
  while(i<s.length){const d=run(i);const goC=d>=4||(set==='C'&&d>=2)||(i===0&&d===s.length&&d>=2&&d%2===0);
    if(goC){if(d%2===1){if(set!=='B'){out.push(set===null?104:100);set='B'}out.push(s.charCodeAt(i)-32);i++;continue}
      if(set!=='C'){out.push(set===null?105:99);set='C'}for(let k=0;k<d;k+=2)out.push(+s.substr(i+k,2));i+=d;continue}
    if(set!=='B'){out.push(set===null?104:100);set='B'}out.push(s.charCodeAt(i)-32);i++}
  if(!out.length)out.push(104);let sum=out[0];for(let k=1;k<out.length;k++)sum+=out[k]*k;out.push(sum%103);out.push(106);return out}
function code128(txt,dir){const v=enc128(txt);let x=10,r='';
  for(const c of v){const p=C128[c];for(let i=0;i<p.length;i++){const w=+p[i];if(i%2===0)r+=dir==='v'?`<rect x="0" y="${x}" width="40" height="${w}"/>`:`<rect x="${x}" y="0" width="${w}" height="40"/>`;x+=w}}x+=10;
  return dir==='v'?`<svg viewBox="0 0 40 ${x}" preserveAspectRatio="none" shape-rendering="crispEdges">${r}</svg>`:`<svg viewBox="0 0 ${x} 40" preserveAspectRatio="none" shape-rendering="crispEdges">${r}</svg>`}
function bcSVG(txt,dir){return getCfg().loaiMaVach==='c39'?code39(txt,dir):code128(txt,dir)}

A.camTorch=async btn=>{const t=camTrack();if(!t||!camCaps().torch)return toast('Camera này không hỗ trợ bật đèn từ trình duyệt','err');CAMX.torch=!CAMX.torch;try{await t.applyConstraints({advanced:[{torch:CAMX.torch}]})}catch(e){CAMX.torch=false}if(btn)btn.classList.toggle('on',CAMX.torch)};

  const steps=[1,1.5,2,3].filter(v=>v>=z.min&&v<=z.max);const i=steps.indexOf(CAMX.zoom);CAMX.zoom=steps[(i+1)%steps.length]||1;try{await t.applyConstraints({advanced:[{zoom:CAMX.zoom}]})}catch(e){}if(btn)btn.textContent='🔍 '+CAMX.zoom+'×'};

async function camTune(){CAMX.torch=false;const t=camTrack();if(!t)return;const c=camCaps();const adv={};
  if(c.focusMode&&c.focusMode.includes('continuous'))adv.focusMode='continuous';if(c.exposureMode&&c.exposureMode.includes('continuous'))adv.exposureMode='continuous';
  if(c.zoom&&c.zoom.max>=1.5&&CAMX.zoom>1)adv.zoom=Math.min(CAMX.zoom,c.zoom.max);try{if(Object.keys(adv).length)await t.applyConstraints({advanced:[adv]})}catch(e){}}
async function scanStart(video,onCode){scanStop();SCAN.cb=onCode;SCAN.last='';SCAN.video=video;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error(location.protocol==='https:'?'Trình duyệt không hỗ trợ camera':'Camera chỉ hoạt động khi mở trang qua https:// (ví dụ địa chỉ GitHub Pages)');
  video.setAttribute('playsinline','');video.muted=true;const cons={video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},audio:false};
  if('BarcodeDetector' in window){let fm=['code_128','code_39','ean_13','ean_8','upc_a','upc_e','qr_code','codabar','itf'];try{const sup=await BarcodeDetector.getSupportedFormats();fm=fm.filter(f=>sup.includes(f))}catch(e){}

      try{SCAN.stream=await navigator.mediaDevices.getUserMedia(cons)}catch(e){if(e.name==='NotAllowedError')throw e;SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
      video.srcObject=SCAN.stream;await video.play();await camTune();
      const loop=async()=>{if(!SCAN.stream)return;try{if(video.readyState>=2){const r=await SCAN.det.detect(video);if(r.length)scanEmit(r[0].rawValue)}}catch(e){}
        if(!SCAN.stream)return;if(video.requestVideoFrameCallback)video.requestVideoFrameCallback(()=>{SCAN.timer=setTimeout(loop,30)});else SCAN.timer=setTimeout(loop,50)};loop();
      return'native'}}
  if(!window.ZXing)await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js');
  const hints=new Map();try{hints.set(ZXing.DecodeHintType.TRY_HARDER,true);hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.CODABAR,ZXing.BarcodeFormat.ITF])}catch(e){}
  SCAN.zx=new ZXing.BrowserMultiFormatReader(hints,60);
  await SCAN.zx.decodeFromConstraints({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},video,(res)=>{if(res)scanEmit(res.getText())});await camTune();return'zxing'}

A.dongBoHSFile=async function(){
  const rows=await pickFileRows();if(!rows)return;const it=rows.map(r=>mapRow(r,BD_COLS)).filter(r=>r.hoTen&&String(r.hoTen).trim());
  if(!it.length)return toast('Không đọc được danh sách – cần có cột Họ tên, Lớp, Mã học sinh','err');if(!it.some(r=>r.ma))return toast('File chưa có cột Mã học sinh (mã định danh). Dùng “Nhập từ Excel” nếu không có mã.','err');
  it.forEach(r=>{r.ma=String(r.ma||'').trim();r.hoTen=String(r.hoTen).trim().replace(/\s+/g,' ');r.lop=String(r.lop||'').trim().toUpperCase();r.loai=/gv|giao vien/.test(norm(r.loai||''))?'GV':'HS'});
  const items=it.filter(r=>r.ma&&r.loai==='HS');const noMa=it.filter(r=>!r.ma).length;
  const hs=S.BanDoc.filter(b=>b.loai!=='GV');const byMa=new Map(hs.map(b=>[norm(b.ma),b]));const fileMa=new Set(items.map(r=>norm(r.ma)));
  const up=[],rekey=[],add=[],used=new Set();const grade=l=>{const m=String(l||'').match(/^(\d+)/);return m?+m[1]:0};
  for(const r of items){const b=byMa.get(norm(r.ma));if(b){used.add(b.ma);const ch=['hoTen','lop','gioiTinh','ngaySinh','sdt'].filter(k=>r[k]&&String(r[k])!==String(b[k]||''));if(ch.length)up.push({b,r,ch});continue}
    const cand=hs.filter(x=>!used.has(x.ma)&&!fileMa.has(norm(x.ma))&&norm(x.hoTen)===norm(r.hoTen)&&(!x.ngaySinh||!r.ngaySinh||x.ngaySinh===r.ngaySinh)&&(!x.lop||!r.lop||x.lop===r.lop||grade(x.lop)+1===grade(r.lop)));
    if(cand.length===1){used.add(cand[0].ma);rekey.push({b:cand[0],r})}else add.push(r)}
  const miss=hs.filter(b=>!used.has(b.ma)&&!fileMa.has(norm(b.ma)));const missMuon=miss.filter(b=>loansOf(b.ma).length);
  const lopCh=up.filter(x=>x.ch.includes('lop')).length;
  const xuong=[...up.filter(x=>x.ch.includes('lop')).map(x=>[x.b.lop,x.r.lop]),...rekey.map(x=>[x.b.lop,x.r.lop])].filter(([a,b])=>grade(a)&&grade(b)&&grade(b)<grade(a)).length;
  const cung=items.filter(r=>{const b=byMa.get(norm(r.ma));return b&&b.lop===r.lop}).length;
  const canh=(xuong?`<div class="note" style="border-color:#fca5a5;background:#fef2f2">⚠ <b>${xuong}</b> học sinh bị chuyển xuống khối thấp hơn – kiểm tra lại có phải file danh sách <b>năm cũ</b> không.</div>`:'')+(cung>items.length/2&&items.length>20?`<div class="note" style="border-color:#fcd34d;background:#fffbeb">⚠ ${cung}/${items.length} học sinh trong file vẫn ở lớp cũ – nếu là đầu năm, có thể file chưa cập nhật lớp mới.</div>`:'');const tb=(L,f)=>L.length?`<div class="tw" style="max-height:190px"><table class="t">${L.slice(0,400).map(f).join('')}</table></div>`:'<p class="muted small">Không có</p>';
  modal('⬆ Lên lớp theo danh sách mới – xem trước',`${canh}<p style="margin-top:0">Đọc được <b>${items.length}</b> học sinh có mã${noMa?` (bỏ qua ${noMa} dòng thiếu mã)`:''}. Đối chiếu theo <b>mã học sinh</b>; học sinh cũ chưa có mã chính thức được ghép theo họ tên (+ ngày sinh, lớp cũ → lớp mới).</p>
   <div class="g2" style="margin:0"><div class="note"><b>${up.length}</b> em cập nhật thông tin${lopCh?` (${lopCh} em lên lớp / đổi lớp)`:''}${tb(up,x=>`<tr><td>${esc(x.r.hoTen)}</td><td class="small">${x.ch.map(k=>k==='lop'?`lớp ${esc(x.b.lop||'—')} → <b>${esc(x.r.lop)}</b>`:k==='hoTen'?'sửa tên':k==='ngaySinh'?'ngày sinh':k).join(', ')}</td></tr>`)}</div>
    <div class="note"><b>${rekey.length}</b> em ghép mã cũ → mã chính thức (lịch sử mượn chuyển theo)${tb(rekey,x=>`<tr><td>${esc(x.r.hoTen)}</td><td class="small">${esc(x.b.ma)} → <b>${esc(x.r.ma)}</b> · ${esc(x.r.lop)}</td></tr>`)}</div>
    <div class="note"><b>${add.length}</b> học sinh mới (vd lớp 6, chuyển đến)${tb(add,r=>`<tr><td>${esc(r.hoTen)}</td><td class="small">${esc(r.ma)} · ${esc(r.lop)}</td></tr>`)}</div>
    <div class="note"><b>${miss.length}</b> em <b>không có</b> trong danh sách mới (ra trường, chuyển đi)${missMuon.length?` – <span class="tag t-er">${missMuon.length} em còn đang mượn sách</span>`:''}${tb(miss,b=>`<tr><td>${esc(b.hoTen)}</td><td class="small">${esc(b.ma)} · ${esc(b.lop)}${loansOf(b.ma).length?' · <b style="color:var(--rd)">đang mượn '+loansOf(b.ma).length+'</b>':''}</td></tr>`)}
     ${fld('Xử lý các em này','miss','danh',{type:'select',options:[['danh','Chuyển sang lớp “Ra trường/Chuyển đi” (giữ lại)'],['xoa','Xóa em không còn mượn sách, em còn mượn chuyển “Ra trường/Chuyển đi”'],['giu','Giữ nguyên']]})}</div></div>

   {wide:1,ok:'Thực hiện lên lớp',onOk:async el=>{const v=vals(el);const ops=[];const bf=backfillLopOps();if(bf)ops.push(bf);const pick=(r,b)=>{const o={};['hoTen','lop','gioiTinh','ngaySinh','sdt'].forEach(k=>{if(r[k])o[k]=r[k]});return o};
    if(up.length)ops.push({t:'upsert',table:'BanDoc',rows:up.map(x=>({ma:x.b.ma,...pick(x.r)}))});
    if(add.length)ops.push({t:'upsert',table:'BanDoc',rows:add.map(r=>({ma:r.ma,hoTen:r.hoTen,loai:'HS',lop:r.lop,gioiTinh:r.gioiTinh||'',ngaySinh:r.ngaySinh||'',sdt:r.sdt||'',ghiChu:''}))});
    if(rekey.length){const mp=new Map(rekey.map(x=>[x.b.ma,x.r.ma]));ops.push({t:'upsert',table:'BanDoc',rows:rekey.map(x=>({...x.b,...pick(x.r),ma:x.r.ma,ghiChu:String(x.b.ghiChu||'').replace(/Thêm nhanh khi mượn – mã tạm/,'').trim()}))});
      const mt=S.MuonTra.filter(m=>mp.has(m.maBanDoc));if(mt.length)ops.push({t:'upsert',table:'MuonTra',rows:mt.map(m=>({id:m.id,maBanDoc:mp.get(m.maBanDoc)}))});
      const dm=S.DatMuon.filter(d=>mp.has(d.maBanDoc));if(dm.length)ops.push({t:'upsert',table:'DatMuon',rows:dm.map(d=>({id:d.id,maBanDoc:mp.get(d.maBanDoc)}))});}
    const RA='Ra trường/Chuyển đi';const del=v.miss==='xoa'?miss.filter(b=>!loansOf(b.ma).length):[];const mark=v.miss==='giu'?[]:miss.filter(b=>!del.includes(b));

function xepHang(db,tu,den,opt={}){const bd=mapBy(db.BanDoc,'ma');const per={};

    const p=per[m.maBanDoc]||(per[m.maBanDoc]={b,n:0,dau:new Set(),dung:0,tra:0});p.n++;p.dau.add(m.sachId);if(m.trangThai==='Đã trả'){p.tra++;if(m.ngayTra<=m.hanTra)p.dung++}});
  const tong={};db.MuonTra.forEach(m=>tong[m.maBanDoc]=(tong[m.maBanDoc]||0)+1);
  return Object.values(per).map(p=>({...p,dau:p.dau.size,tong:tong[p.b.ma]||0,pctDung:p.tra?Math.round(p.dung/p.tra*100):null})).sort((a,b)=>b.n-a.n||b.dau-a.dau||tenSort(a.b.hoTen,b.b.hoTen))}
function xepLop(db,tu,den){const si={},n={};db.BanDoc.forEach(b=>{if(b.loai!=='GV'&&b.lop&&!/^ra trư/i.test(b.lop))si[b.lop]=(si[b.lop]||0)+1});const bd=mapBy(db.BanDoc,'ma');
  db.MuonTra.forEach(m=>{if(m.ngayMuon<tu||m.ngayMuon>den)return;const b=bd[m.maBanDoc];const l=b&&(m.lop||b.lop);if(b&&b.loai!=='GV'&&l&&si[l])n[l]=(n[l]||0)+1});
  return Object.keys(n).map(l=>({lop:l,n:n[l],si:si[l]||0,tb:Math.round(n[l]/(si[l]||1)*100)/100})).sort((a,b)=>b.tb-a.tb)}

/* ================== PHẦN 11: thống kê theo năm học, lưu hồ sơ ≥ 5 năm, lên lớp ================== */
const GIU_NAM=5;
function namHocCua(d){d=String(d||'').slice(0,10);if(!/^\d{4}-\d{2}/.test(d))return null;const y=+d.slice(0,4);return d>=nhBatDau(y)?y:y-1}
function namHocNay(){return namHocCua(today())}
const nhTen=y=>y+'–'+(y+1);
const nhKhoang=y=>[nhBatDau(y),addDays(nhBatDau(y+1),-1)];
function mocLuuTru(){return(namHocNay()-GIU_NAM)+'-09-01'}
/* Lớp của bạn đọc tại thời điểm mượn (phiếu mới tự ghi; phiếu cũ lấy lớp hiện tại) */
function lopLuc(m,bm){const b=bm[m.maBanDoc]||{};if(b.loai==='GV')return'Giáo viên';return m.lop||b.lop||'(chưa rõ)'}
function stampLop(ops){if(!S)return;const bm=mapBy(S.BanDoc,'ma');const has=new Set(S.MuonTra.map(m=>m.id));
  ops.forEach(op=>{if(op.t!=='upsert'||op.table!=='MuonTra')return;op.rows.forEach(r=>{if(!has.has(r.id)&&r.maBanDoc&&!r.lop){const b=bm[r.maBanDoc];if(b)r.lop=b.loai==='GV'?'GV':(b.lop||'')}})})}
function backfillLopOps(){const bm=mapBy(S.BanDoc,'ma');const rows=S.MuonTra.filter(m=>!m.lop&&bm[m.maBanDoc]).map(m=>{const b=bm[m.maBanDoc];return{id:m.id,lop:b.loai==='GV'?'GV':(b.lop||'')}}).filter(r=>r.lop);
  return rows.length?{t:'upsert',table:'MuonTra',rows}:null}
function soBanTL(t){const d=String(t.ds||'');try{const a=JSON.parse(d);if(Array.isArray(a))return a.length}catch(e){}return d.split(/[,;\s]+/).filter(Boolean).length}
function khoiCua(l){if(l==='Giáo viên')return'Giáo viên';const m=String(l).match(/^(\d+)/);return m?'Khối '+m[1]:'Khác'}

/* ---------- Số liệu một năm học ---------- */
function soLieuNam(y){const[a,b]=nhKhoang(y);const inR=d=>d&&d>=a&&d<=b;const bm=mapBy(S.BanDoc,'ma'),sm=mapBy(S.Sach,'id');
  const ls=S.MuonTra.filter(m=>inR(m.ngayMuon)),tr=S.MuonTra.filter(m=>inR(m.ngayTra));const gv=ls.filter(m=>(bm[m.maBanDoc]||{}).loai==='GV').length;
  const nhap=S.BanSach.filter(x=>inR(x.ngayNhap));const tl=S.ThanhLy.filter(t=>inR(t.ngay));const td=S.TietDoc.filter(t=>inR(t.ngay));
  const dung=tr.filter(m=>m.hanTra&&m.ngayTra<=m.hanTra).length;
  const byDm={},nhapDm={},byKhoi={},byLop={},byM={};
  ls.forEach(m=>{const d=(sm[m.sachId]||{}).danhMucId||'';byDm[d]=(byDm[d]||0)+1;const l=lopLuc(m,bm);const k=khoiCua(l);byKhoi[k]=(byKhoi[k]||0)+1;const o=byLop[l]||(byLop[l]={luot:0,ng:new Set()});o.luot++;o.ng.add(m.maBanDoc);const mm=m.ngayMuon.slice(0,7);byM[mm]=(byM[mm]||0)+1});
  nhap.forEach(x=>{const d=(sm[x.sachId]||{}).danhMucId||'';nhapDm[d]=(nhapDm[d]||0)+1});
  return{y,a,b,ls,tr,gv,nhap,tl,td,byDm,nhapDm,byKhoi,byLop,byM,ban:new Set(ls.map(m=>m.maBanDoc)).size,dau:new Set(ls.map(m=>m.sachId)).size,
    giaNhap:nhap.reduce((s,x)=>s+(+(sm[x.sachId]||{}).gia||0),0),tlBan:tl.reduce((s,t)=>s+soBanTL(t),0),tdHS:td.reduce((s,t)=>s+(+t.soHS||0),0),
    boiThuong:tr.reduce((s,m)=>s+(+m.boiThuong||0),0),dungHan:tr.length?Math.round(dung/tr.length*100):null}}
function dsNamHoc(){let mn=namHocNay();const f=d=>{const y=namHocCua(d);if(y!=null&&y<mn)mn=y};
  S.MuonTra.forEach(m=>f(m.ngayMuon));S.BanSach.forEach(b=>f(b.ngayNhap));S.TietDoc.forEach(t=>f(t.ngay));S.ThanhLy.forEach(t=>f(t.ngay));
  mn=Math.max(mn,namHocNay()-20);const r=[];for(let y=namHocNay();y>=Math.min(mn,namHocNay()-(GIU_NAM-1));y--)r.push(y);return r}

  const ch=[...D].reverse();

/* ---------- Lên lớp đầu năm: xem trước, sửa từng lớp, chặn lên lớp 2 lần ---------- */
A.lenLop=function(){if(!isAdmin())return toast('Cần tài khoản quản trị để lên lớp','err');const c=getCfg();const nh=namHocNay();
  const hs=S.BanDoc.filter(b=>b.loai!=='GV'&&b.lop&&!/^ra trư/i.test(b.lop));const lops=[...new Set(hs.map(b=>b.lop))].sort((a,b)=>a.localeCompare(b,'vi',{numeric:true}));
  const kc=+(c.khoiCuoi||9);const goiY=l=>{const m=String(l).match(/^(\d+)(.*)$/);if(!m)return l;const g=+m[1];return g>=kc?'Ra trường':(g+1)+m[2]};
  const si=l=>hs.filter(b=>b.lop===l).length;const muon=l=>hs.filter(b=>b.lop===l&&loansOf(b.ma).length).length;
  const m=modal('⬆ Lên lớp đầu năm học '+nhTen(nh),`${c.lenLopNam===String(nh)?`<div class="note" style="border-color:#fca5a5;background:#fef2f2"><b>⚠ Năm học ${nhTen(nh)} đã thực hiện lên lớp</b> (ngày ${vn(c.lenLopNgay||'')}). Làm lại sẽ đẩy học sinh lên thêm một lớp nữa – chỉ làm khi chắc chắn.</div>`:''}
   <p style="margin-top:0">Mỗi lớp được chuyển sang <b>lớp mới</b> theo gợi ý (số khối + 1). Có thể sửa ô “Lớp mới” (vd tách/gộp lớp). Ghi <b>Ra trường</b> cho lớp cuối cấp, để trống = giữ nguyên.</p>
   <div class="fr">${fld('Khối cuối cấp','khoiCuoi',String(kc),{type:'number',attr:'min=1 max=12 style="width:80px"'})}</div>
   <div class="tw" style="max-height:330px;margin-top:8px"><table class="t"><tr><th>Lớp hiện tại</th><th class="c">Sĩ số</th><th>Lớp mới</th><th class="c">Còn mượn sách</th></tr>
   ${lops.map((l,i)=>`<tr><td><b>${esc(l)}</b></td><td class="c">${si(l)}</td><td><input class="inp llm" data-lop="${esc(l)}" value="${esc(goiY(l))}" style="width:140px;padding:4px 8px"></td><td class="c">${muon(l)||''}</td></tr>`).join('')||'<tr><td colspan=4 class="empty">Chưa có học sinh</td></tr>'}</table></div>
   ${fld('Học sinh lưu ban – ở lại lớp cũ (mã bạn đọc, mỗi dòng một mã)','luuBan','',{type:'textarea',rows:2})}
   ${fld('','xoa',false,{type:'check',text:'Xóa hẳn học sinh ra trường (không còn mượn sách). Khuyên KHÔNG chọn: giữ lại để hồ sơ 5 năm đầy đủ tên người mượn.'})}
   <p class="small muted">Lịch sử mượn của các năm trước vẫn giữ đúng lớp lúc mượn. Nếu có file danh sách mới có mã học sinh, dùng “⬆ Lên lớp đầu năm (theo danh sách mới)” sẽ chính xác hơn. Nên tải bản sao lưu trước.</p>`,
   {wide:1,ok:'Thực hiện lên lớp',onOk:async el=>{const v=vals(el);const map={};$$('.llm',el).forEach(i=>map[i.dataset.lop]=i.value.trim());
    const giu=new Set(v.luuBan.split(/[\s,;]+/).map(x=>norm(x)).filter(Boolean));const up=[],del=[];let n=0,ra=0;
    for(const b of hs){if(giu.has(norm(b.ma)))continue;const moi=map[b.lop];if(!moi||moi===b.lop)continue;
      if(/^ra trư/i.test(moi)){ra++;if(v.xoa&&!loansOf(b.ma).length)del.push(b.ma);else up.push({ma:b.ma,lop:'Ra trường'})}else{n++;up.push({ma:b.ma,lop:moi})}}
    if(!up.length&&!del.length)throw new Error('Không có thay đổi');const ops=[];const bf=backfillLopOps();if(bf)ops.push(bf);

    if(!await commit(ops,`Đã lên lớp ${n} học sinh, ${ra} học sinh ra trường`))return false;BD.lop='';rerender()}});
  $('[name=khoiCuoi]',m.root).oninput=e=>{const k=+e.target.value||9;$$('.llm',m.root).forEach(i=>{const mm=i.dataset.lop.match(/^(\d+)(.*)$/);if(mm)i.value=+mm[1]>=k?'Ra trường':(+mm[1]+1)+mm[2]})}};

/* Bộ sách lưu ở CaiDat.boSach dạng JSON: [{id,ten,ds:[sachId…],han:'yyyy-mm-dd'|''}] */
function getBo(){try{const a=JSON.parse(getCfg().boSach||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
const boById=id=>getBo().find(b=>b.id===id);
async function luuBoList(list,msg){return commit([{t:'upsert',table:'CaiDat',rows:[{key:'boSach',value:JSON.stringify(list)}]}],msg)}
const boSt=sc=>sc==='MT'?MT:QC;
function boCur(sc){const st=boSt(sc);if(!st.bo||!st.reader||st.boFor!==st.reader.ma)return null;return boById(st.bo)||null}
function boOf(sc,dk){const bo=boCur(sc);const b=findBan(dk);return bo&&b&&bo.ds.includes(b.sachId)?bo.id:''}
function boNote(sc,dk){const id=boOf(sc,dk);return id?'Bộ: '+boById(id).ten:''}
function boCount(sc){return boSt(sc).cart.filter(dk=>boOf(sc,dk)).length}
function sanBan(sid,tru=[]){return S.BanSach.filter(b=>b.sachId===sid&&b.tinhTrang==='Sẵn sàng'&&!tru.includes(b.dkcb)).sort((a,b)=>String(a.dkcb).localeCompare(String(b.dkcb),'vi',{numeric:true}))}
/* Tình trạng từng đầu sách của bộ đối với một bạn đọc */
function boPlan(bo,ma,cart){const sm=mapBy(S.Sach,'id');const ln=loansOf(ma);
  return bo.ds.filter(sid=>sm[sid]).map(sid=>{const inCart=cart.find(dk=>(findBan(dk)||{}).sachId===sid);const da=ln.find(m=>m.sachId===sid);
    return{sid,s:sm[sid],inCart,da,san:sanBan(sid,cart).length}})}

     <div class="g2" style="margin-top:10px"><button type="button" class="btn pri" id="boQ" style="justify-content:center;padding:11px">📷 Quét từng cuốn (hiện danh sách đánh dấu)</button><button type="button" class="btn or" id="boA" style="justify-content:center;padding:11px">⚡ Tự chọn bản còn sẵn cho cả bộ</button></div>
     <p class="small muted">“Quét từng cuốn”: đưa sách nào thì quét cuốn đó – chính xác nhất. “Tự chọn”: máy chọn số ĐKCB còn sẵn, dùng khi phát sách theo số thứ tự / sách chưa dán mã.</p>`;

  toast(`Đã thêm ${n} cuốn${het?` · ${het} đầu sách đã hết bản`:''}`,het?'err':undefined)}

function traBoBtns(ma){const g={};loansOf(ma).forEach(m=>{if(m.bo)(g[m.bo]=g[m.bo]||[]).push(m)});

  if(await commit(L.flatMap(m=>traOps(m)),`Đã trả ${L.length} cuốn`)){fillMT();fillMTList()}};

   <div id="ebS" class="mls" style="max-height:320px"></div><div id="ebN" class="small" style="margin-top:6px"></div>`,
   {wide:1,ok:'Lưu bộ sách',onOk:async el=>{const v=vals(el);if(!v.ten.trim())throw new Error('Nhập tên bộ');if(!sel.size)throw new Error('Chưa chọn đầu sách nào');

  const list=()=>{const q=$('#ebQ',m.root).value,t=($('#ebT',m.root)||{}).value;return S.Sach.filter(s=>(!q||matchQ(s.nhanDe,q))&&(!t||s.hashtag===t)).sort((a,c)=>a.nhanDe.localeCompare(c.nhanDe,'vi',{numeric:true}))};
  const fill=()=>{const {dem}=countCopies(S.BanSach);const l=list();
    $('#ebS',m.root).innerHTML=l.slice(0,300).map(s=>`<label class="chk"><input type="checkbox" data-s="${esc(s.id)}" ${sel.has(s.id)?'checked':''}> ${esc(s.nhanDe)} <span class="muted small">(sẵn ${(dem[s.id]||{}).san||0}/${(dem[s.id]||{}).tong||0})</span></label>`).join('')||'<div class="muted">Không có sách phù hợp</div>';

/* Lưu bộ tự động sau khi "Nhập bộ SGK" */

/* ================== PHẦN 13: quét mã ISBN khi mượn/trả, gộp sách trùng, khai báo năm học ================== */
/* ---------- Quét ISBN (mã vạch in sẵn sau bìa) khi cho mượn: tự chọn bản còn sẵn ---------- */
const sachTheoISBN=code=>S.Sach.filter(s=>s.isbn&&isbnEq(s.isbn,code));
function isbnMuon(code,cart){const ss=sachTheoISBN(code);if(!ss.length)return{err:`Mã ISBN ${code} chưa có trong kho. Nhập sách này ở chế độ Nhập kho (hoặc Biên mục sách) trước.`};
  const f=ss.flatMap(s=>sanBan(s.id,cart))[0];if(!f)return{err:`“${ss[0].nhanDe}” đã hết bản sẵn sàng`};return{ban:f,s:ss.find(s=>s.id===f.sachId)}}
/* Trả bằng ISBN: tìm ai đang mượn đầu sách này */
function isbnTra(code,done){const ids=new Set(sachTheoISBN(code).map(s=>s.id));const sm=mapBy(S.Sach,'id'),bm=mapBy(S.BanDoc,'ma');
  if(!ids.size){toast(`Mã ISBN ${code} chưa có trong kho`,'err');return done&&done(null)}
  const L=S.MuonTra.filter(m=>m.trangThai==='Đang mượn'&&ids.has(m.sachId)).sort((a,b)=>String(a.ngayMuon).localeCompare(String(b.ngayMuon)));
  if(!L.length){toast('Không có ai đang mượn sách này','err');return done&&done(null)}
  const tra=async m=>{const ok=await commit(traOps(m),'Đã trả '+m.dkcb);done&&done(ok?m:null)};
  if(L.length===1)return tra(L[0]);
  const md=modal('↩ Ai đang trả cuốn này?',`<p style="margin-top:0">Mã vạch ISBN là chung cho mọi cuốn “${esc(sm[L[0].sachId].nhanDe)}”. Chọn người trả:</p><div class="cbg">${L.map(m=>{const r=bm[m.maBanDoc]||{};return`<button type="button" data-id="${esc(m.id)}"><b>${esc(r.hoTen||m.maBanDoc)}</b><small>${esc(r.lop||'')} · ${esc(m.dkcb)} · mượn ${vn(m.ngayMuon)}${m.hanTra<today()?' · <span style="color:var(--rd)">quá hạn</span>':''}</small></button>`}).join('')}</div>
   <p class="small muted">Mẹo: dán nhãn số ĐKCB riêng cho từng cuốn để quét trả không phải chọn.</p>`,{wide:1,noOk:true,cancel:'Hủy'});
  $('.cbg',md.root).onclick=e=>{const d=e.target.closest('[data-id]');if(!d)return;md.close();tra(L.find(m=>m.id===d.dataset.id))}}
const _traNhanh=A.traNhanh;
A.traNhanh=function(dk){if(dk&&isISBN(dk)&&!findBan(dk)){$('#trB').value='';isbnTra(dk,m=>{if(m){$('#trI').innerHTML=`✔ Đã trả <b>${esc(m.dkcb)}</b>`;fillMT();fillMTList()}});return}return _traNhanh.apply(this,arguments)};

/* ---------- Gộp đầu sách bị nhập trùng ---------- */
function nhomTrung(){const g={};S.Sach.forEach(s=>{const k=norm(s.nhanDe)+'|'+norm(s.tacGia);(g[k]=g[k]||[]).push(s)});return Object.values(g).filter(x=>x.length>1)}
A.gopSach=function(){if(!isAdmin())return toast('Cần tài khoản quản trị để gộp sách','err');const G=nhomTrung();if(!G.length)return toast('Không có đầu sách nào bị trùng 👍');const {dem}=countCopies(S.BanSach);
  modal('🧩 Gộp đầu sách bị trùng',`<p style="margin-top:0">Tìm thấy <b>${G.length}</b> nhóm đầu sách cùng tên + tác giả. Gộp sẽ chuyển toàn bộ bản sách, phiếu mượn, đặt mượn về <b>một</b> đầu sách (ưu tiên đầu sách có ISBN), điền các thông tin còn thiếu, rồi xóa đầu sách thừa.</p>
   ${G.map((g,i)=>`<label class="chk" style="display:block;border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:6px"><input type="checkbox" data-g="${i}" checked> <b>${esc(g[0].nhanDe)}</b> – ${esc(g[0].tacGia||'')}<div class="small muted">${g.map(s=>`${esc(s.id)}: ${(dem[s.id]||{}).tong||0} bản${s.isbn?' · ISBN '+esc(s.isbn):''}`).join(' &nbsp;|&nbsp; ')}</div></label>`).join('')}`,
   {wide:1,ok:'Gộp các nhóm đã chọn',onOk:async el=>{const sel=$$('[data-g]:checked',el).map(x=>G[+x.dataset.g]);if(!sel.length)throw new Error('Chưa chọn nhóm nào');const ops=[];let n=0;
    for(const g of sel){const keep=[...g].sort((a,b)=>(b.isbn?1:0)-(a.isbn?1:0)||((dem[b.id]||{}).tong||0)-((dem[a.id]||{}).tong||0))[0];const bo=g.filter(s=>s!==keep);const ids=new Set(bo.map(s=>s.id));
      const fill={id:keep.id};Object.keys(keep).forEach(k=>{if(!String(keep[k]||'').trim()){const v=bo.map(s=>s[k]).find(x=>String(x||'').trim());if(v)fill[k]=v}});if(Object.keys(fill).length>1)ops.push({t:'upsert',table:'Sach',rows:[fill]});
      const bs=S.BanSach.filter(b=>ids.has(b.sachId));if(bs.length)ops.push({t:'upsert',table:'BanSach',rows:bs.map(b=>({dkcb:b.dkcb,sachId:keep.id}))});
      const mt=S.MuonTra.filter(m=>ids.has(m.sachId));if(mt.length)ops.push({t:'upsert',table:'MuonTra',rows:mt.map(m=>({id:m.id,sachId:keep.id}))});
      const dm=S.DatMuon.filter(d=>ids.has(d.sachId));if(dm.length)ops.push({t:'upsert',table:'DatMuon',rows:dm.map(d=>({id:d.id,sachId:keep.id}))});
      const L=getBo();let ch=false;L.forEach(b=>{if(b.ds.some(x=>ids.has(x))){b.ds=[...new Set(b.ds.map(x=>ids.has(x)?keep.id:x))];ch=true}});if(ch)ops.push({t:'upsert',table:'CaiDat',rows:[{key:'boSach',value:JSON.stringify(L)}]});
      ops.push({t:'remove',table:'Sach',keys:[...ids]});n+=bo.length}
    if(!await commit(ops,`Đã gộp, bỏ ${n} đầu sách trùng`))return false;rerender()}})};

function ngayNghiMap(){try{return JSON.parse(getCfg().ngayNghi||'{}')||{}}catch(e){return{}}}
function parseNgayNghi(txt){const o={};String(txt||'').split('\n').forEach(l=>{l=l.trim();if(!l)return;const m=l.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s*[-–]\s*(\d{1,2})\/(\d{1,2})\/(\d{4}))?\s*(.*)$/);if(!m)return;

  const row=d=>{const o=day[d];if(!o)return null;const h=TKBD_H.map(k=>o.hs[k].size+o.hsT[k]);const th=h.reduce((x,y)=>x+y,0);return{h,th,gv:o.gv.size+o.gvT,tong:th+o.gv.size+o.gvT,lhs:TKBD_LHS.map(k=>o.lhs[k]||0),lgv:TKBD_LGV.map(k=>o.lgv[k]||0)}};

    const sum=days.reduce((s,x)=>{if(!x.r)return s;x.r.h.forEach((v,i)=>s.h[i]+=v);s.th+=x.r.th;s.gv+=x.r.gv;s.tong+=x.r.tong;x.r.lhs.forEach((v,i)=>s.lhs[i]+=v);x.r.lgv.forEach((v,i)=>s.lgv[i]+=v);return s},{h:[0,0,0,0,0],th:0,gv:0,tong:0,lhs:[0,0,0,0,0],lgv:[0,0,0,0,0,0]});
    months.push({ten:'Tháng '+mm+'/'+yy,days,sum});cur=iso(new Date(yy,mm,1)).slice(0,7)}

function parseSoSGK(aoa){const s=v=>String(v??'').trim();let hr=aoa.findIndex(r=>r.some(c=>/T[ỔO]NG S[ỐO] B[ẢA]N/i.test(s(c))));if(hr<0)return null;
  const hdr=aoa[hr].map(s);const col=re=>hdr.findIndex(c=>re.test(c));const cNam=col(/N[ĂA]M H[ỌO]C/i),cCT=col(/CH[ỨU]NG T[ỪU]/i),cXB=col(/XU[ẤA]T B[ẢA]N/i),cSo=col(/T[ỔO]NG S[ỐO] B[ẢA]N/i),cGia=col(/[ĐD][ƠO]N GI[ÁA]/i);
  /* cột kiểm kê: tìm dòng có "Mất" */let kk=[];for(let r=hr+1;r<hr+4&&r<aoa.length;r++){const row=aoa[r].map(s);row.forEach((c,i)=>{if(/^M[ấa]t$/i.test(c))kk.push(i)});if(kk.length)break}
  const items=[];let cur=null;
  for(let r=hr+1;r<aoa.length;r++){const row=aoa[r];const a=s(row[cNam<0?0:cNam]);if(!a)continue;if(/^Nh[ậa]n th[ựu]c|^Ng[àa]y \.|^Ng[ườu]*[ờo]i l[ậa]p/i.test(a))break;
    const ym=a.match(/^(\d{4})\s*[-–]\s*(\d{4})$/);
    if(!ym){if(/^(NGÀY VÀO SỔ|Mất|Còn)$/i.test(a))continue;let tm=0;for(let i=kk.length-1;i>=0;i--){const mv=s(row[kk[i]]),cv=s(row[kk[i]+1]);if(mv!==''||cv!==''){tm=parseInt(mv)||0;break}}cur={ten:a.replace(/\s+/g,' ').trim(),batch:[],titMat:tm};items.push(cur);continue}
    const n=parseInt(s(row[cSo]).replace(/[^\d]/g,''))||0;if(!cur||!n)continue;
    let mat=0;for(let i=kk.length-1;i>=0;i--){const mv=s(row[kk[i]]),cv=s(row[kk[i]+1]);if(mv!==''||cv!==''){mat=parseInt(mv)||0;break}}
    const ct=s(row[cCT]);cur.batch.push({y:+ym[1],n,ct:/kh[ôo]ng x[áa]c [đd][ịi]nh/i.test(ct)?'':ct,nx:s(row[cXB]).replace(/[^\d]/g,'').slice(0,4),gia:String(parseInt(s(row[cGia]).replace(/[^\d]/g,''))||''),mat:Math.min(mat,n)})}
  /* số mất ghi chung ở dòng tên sách → phân cho các lần nhập cũ nhất */
  items.forEach(x=>{let du=(x.titMat||0)-x.batch.reduce((a,b)=>a+b.mat,0);for(const b of x.batch){if(du<=0)break;const k=Math.min(du,b.n-b.mat);b.mat+=k;du-=k}});
  return items}
async function napSoSGKFile(){return new Promise(res=>{const inp=document.createElement('input');inp.type='file';inp.accept='.xls,.xlsx';inp.onchange=async()=>{const f=inp.files[0];if(!f)return res(null);busy(true);
  try{const X=await loadXLSX();const wb=X.read(await f.arrayBuffer());const ws=wb.Sheets[wb.SheetNames[0]];res(X.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}))}catch(e){toast('Không đọc được file: '+e.message,'err');res(null)}finally{busy(false)}};inp.click()})}

    for(const x of items){let s=tim(x.ten);if(!s){const lb=x.batch[x.batch.length-1];s={id:uid('S'),nhanDe:x.ten,tacGia:'',nxb:'Giáo dục Việt Nam',namXB:lb.nx,danhMucId:v.dm,gia:lb.gia,isbn:'',hashtag:'SGK',moTa:'',noiBat:'',anhBia:'',ngayTao:t};s.soPhanLoai=goiYDDC(s);sach.push(s);S.Sach.push(s)}

function keyTen(t){return norm(String(t||'').replace(/\([^)]*\)/g,' ')).replace(/[–—-]/g,' ').replace(/\btap mot\b/g,'tap 1').replace(/\btap hai\b/g,'tap 2').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}

  m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/);if(m)return`20${m[3]}-${z2(m[1])}-${z2(m[2])}`;if(/^\d{5}$/.test(v)){const d=new Date(Math.round((+v-25569)*864e5));return iso(d)}return''}

function parseBienMuc(aoa){const s=v=>String(v??'').replace(/\s+/g,' ').trim();const hr=aoa.findIndex(r=>r.some(c=>/T[ÊE]N S[ÁA]CH/i.test(s(c)))&&r.some(c=>/S[ỐO] L[ƯU][ỢO]NG/i.test(s(c))));if(hr<0)return null;
  const W=Math.max(...aoa.slice(hr,hr+3).map(r=>r.length));const H=[];for(let c=0;c<W;c++)H.push([0,1,2].map(i=>s((aoa[hr+i]||[])[c])).join(' | '));
  const col=re=>H.findIndex(h=>re.test(h));

  const sub=aoa.findIndex((r,i)=>i>=hr&&i<hr+4&&r.some(c=>/Nh[àa] XB|Ph[áa]t kh[ôo]ng/i.test(s(c))));const start=(sub>=0?sub:hr+2)+1;const out=[];
  for(let r=start;r<aoa.length;r++){const row=aoa[r]||[];const g=k=>C[k]>=0?s(row[C[k]]):'';const ten=g('ten');const sl=parseInt(g('sl').replace(/[^\d]/g,''))||0;if(!ten||!sl)continue;

  const slKhoi={};out.forEach(x=>{const m=x.ten.match(/\s(\d{1,2})(\s+t[ậa]p\s*\d)?$/i);if(m){(slKhoi[x.sl]=slKhoi[x.sl]||new Set()).add(m[1])}});

  return out}

const DT_LIST=[['K6','Khối 6'],['K7','Khối 7'],['K8','Khối 8'],['K9','Khối 9'],['KXD','Không xác định'],['GV','Giáo viên'],['BGH','BGH']];

const DTV={tab:'tc',loai:'',thang:'',ngay:''};const DQ={};let dqT=0;

function ldNgay(d){const o={dt:{},hs:{},gv:{}};S.LuotDoc.forEach(r=>{if(r.ngay!==d)return;o.dt[r.doiTuong]=(o.dt[r.doiTuong]||0)+(+r.soLuot||0);if(r.loaiSach&&+r.soSach){const g=isGVdt(r.doiTuong)?o.gv:o.hs;g[r.loaiSach]=(g[r.loaiSach]||0)+(+r.soSach)}});return o}
function pgTietDocMoi(){if(DTV.tab==='td'){pgTietDoc();$('#ct').insertAdjacentHTML('afterbegin',dtvTabs());return}

   <div class="acts"><button class="btn" onclick="A.soThongKeBD()">📊 Sổ thống kê bạn đọc</button>${isAdmin()?'<button class="btn" onclick="A.napSoTKBD()">📥 Nạp sổ thống kê cũ (Excel)</button>':''}</div></div>

   <div class="dqg">${DT_LIST.map(d=>`<div class="dqb ${isGVdt(d[0])?'gv':''}"><button class="p" onclick="A.dqCong('${d[0]}',1)"><b>${d[1]}</b><span id="dq_${d[0]}">${o.dt[d[0]]||0}</span><small>+1</small></button><button class="m" title="Bớt 1 (bấm nhầm)" onclick="A.dqCong('${d[0]}',-1)">−</button></div>`).join('')}</div></div>
  <div class="g2 g32" style="margin-top:14px"><div class="card"><div class="fr" style="justify-content:space-between"><h3 style="margin:0">📅 Theo ngày</h3><input type="month" class="inp" style="width:auto" value="${DTV.thang}" onchange="DTV.thang=this.value;pgTietDocMoi()"></div><div id="dqTb" style="margin-top:8px"></div></div>
   <div class="card"><h3>✍ Nhập / sửa số liệu một ngày</h3><p class="small muted" style="margin-top:-4px">Dùng khi ghi sổ tay rồi nhập lại, hoặc sửa số đã ghi. Bấm vào một ngày ở bảng bên trái để sửa.</p><div id="dqF"></div></div></div>`;

/* Bấm nhanh: gộp các lần bấm trong 0,8 giây rồi mới lưu 1 lần */
A.dqCong=(dt,d)=>{const t=today();const k=dt+'|'+DTV.loai;const cur=(ldNgay(t).dt[dt]||0)+Object.entries(DQ).filter(([x])=>x.startsWith(dt+'|')).reduce((a,[,v])=>a+v,0);if(d<0&&cur<=0)return;
  DQ[k]=(DQ[k]||0)+d;const el=$('#dq_'+dt);if(el)el.textContent=cur+d;const tt=$('#dqT');if(tt)tt.textContent=(+tt.textContent.replace(/\D/g,'')+d)+' lượt';try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
  clearTimeout(dqT);dqT=setTimeout(dqFlush,800)};
async function dqFlush(){const t=today();const ks=Object.keys(DQ).filter(k=>DQ[k]);if(!ks.length)return;const rows=[];const take={...DQ};ks.forEach(k=>delete DQ[k]);
  for(const k of ks){const [dt,ls]=k.split('|');const n=take[k];let r=S.LuotDoc.find(x=>x.ngay===t&&x.doiTuong===dt&&(x.loaiSach||'')===ls&&x.nguoiGhi==='nhanh');
    if(!r&&n<0){r=S.LuotDoc.filter(x=>x.ngay===t&&x.doiTuong===dt&&+x.soLuot>0).slice(-1)[0];if(!r)continue}
    const sl=Math.max(0,(+((r||{}).soLuot)||0)+n);rows.push({id:r?r.id:uid('LD'),ngay:t,doiTuong:dt,soLuot:String(sl),loaiSach:r?r.loaiSach||'':ls,soSach:String((r?r.loaiSach:ls)?sl:0),ghiChu:'',nguoiGhi:r?r.nguoiGhi:'nhanh'})}
  if(rows.length&&await commit([{t:'upsert',table:'LuotDoc',rows}],'')){if(location.hash.includes('tiet-doc')&&DTV.tab==='tc'){fillDQTb();if(DTV.ngay===t)fillDQF()}}}
function fillDQTb(){const el=$('#dqTb');if(!el)return;const days=[...new Set(S.LuotDoc.filter(r=>String(r.ngay).startsWith(DTV.thang)).map(r=>r.ngay))].sort();
  const tot={};el.innerHTML=days.length?`<div class="tw" style="max-height:420px"><table class="t"><tr><th>Ngày</th>${DT_LIST.map(d=>`<th class="c">${d[0]==='KXD'?'KXĐ':d[0].replace('K','K.')}</th>`).join('')}<th class="c">Tổng</th><th>Loại sách</th></tr>
   ${days.map(d=>{const o=ldNgay(d);let s=0;const cells=DT_LIST.map(x=>{const v=o.dt[x[0]]||0;s+=v;tot[x[0]]=(tot[x[0]]||0)+v;return`<td class="c">${v||''}</td>`}).join('');tot._=(tot._||0)+s;
     const ls=[...Object.entries(o.hs).map(([k,v])=>`HS ${(LS_LIST.find(l=>l[0]===k)||[])[1]}: ${v}`),...Object.entries(o.gv).map(([k,v])=>`GV ${(LS_LIST.find(l=>l[0]===k)||[])[1]}: ${v}`)].join(', ');
     return`<tr style="cursor:pointer" onclick="DTV.ngay='${d}';fillDQF()"><td>${vn(d)}</td>${cells}<td class="c"><b>${s}</b></td><td class="small">${esc(ls)}</td></tr>`}).join('')}
   <tr style="font-weight:700"><td>Cả tháng</td>${DT_LIST.map(x=>`<td class="c">${tot[x[0]]||''}</td>`).join('')}<td class="c">${tot._||0}</td><td></td></tr></table></div>`:'<div class="empty small">Chưa có số liệu tháng này</div>'}
function fillDQF(){const el=$('#dqF');if(!el)return;const d=DTV.ngay;const o=ldNgay(d);const ls5=[['TK','Tham khảo'],['TN','Thiếu nhi'],['KHAC','Khác'],['SGK','Giáo khoa'],['BAO','Báo, tạp chí']],ls6=[['TK','Tham khảo'],['NV','Nghiệp vụ'],['TN','Thiếu nhi'],['KHAC','Khác'],['SGK','Giáo khoa'],['BAO','Báo, tạp chí']];
  const num=(n,v,l)=>`<label class="dqn"><span>${l}</span><input type="number" min="0" class="inp" name="${n}" value="${v||''}"></label>`;
  el.innerHTML=`<div class="fr">${fld('Ngày','ngay',d,{type:'date'})}</div><div class="small" style="margin:8px 0 4px"><b>Số lượt bạn đọc</b></div><div class="dqf">${DT_LIST.map(x=>num('d_'+x[0],o.dt[x[0]],x[1])).join('')}</div>
   <div class="small" style="margin:8px 0 4px"><b>Loại sách – học sinh</b></div><div class="dqf">${ls5.map(x=>num('h_'+x[0],o.hs[x[0]],x[1])).join('')}</div>
   <div class="small" style="margin:8px 0 4px"><b>Loại sách – giáo viên, BGH</b></div><div class="dqf">${ls6.map(x=>num('g_'+x[0],o.gv[x[0]],x[1])).join('')}</div>
   <div class="acts" style="margin-top:10px"><button class="btn pri" onclick="A.luuDQ()">💾 Lưu ngày này</button></div>`;
  $('[name=ngay]',el).onchange=e=>{DTV.ngay=e.target.value;fillDQF()}}
/* Lưu một ngày: thay toàn bộ số liệu của ngày đó bằng số trong ô */
A.luuDQ=async()=>{const el=$('#dqF');const v=vals(el);const d=v.ngay;if(!d)return toast('Chọn ngày','err');const rows=[];const n=x=>Math.max(0,parseInt(x)||0);
  DT_LIST.forEach(x=>{if(n(v['d_'+x[0]]))rows.push({id:uid('LD'),ngay:d,doiTuong:x[0],soLuot:String(n(v['d_'+x[0]])),loaiSach:'',soSach:'0',ghiChu:'',nguoiGhi:'nhap'})});
  ['TK','TN','KHAC','SGK','BAO'].forEach(k=>{if(n(v['h_'+k]))rows.push({id:uid('LD'),ngay:d,doiTuong:'KXD',soLuot:'0',loaiSach:k,soSach:String(n(v['h_'+k])),ghiChu:'',nguoiGhi:'nhap'})});
  ['TK','NV','TN','KHAC','SGK','BAO'].forEach(k=>{if(n(v['g_'+k]))rows.push({id:uid('LD'),ngay:d,doiTuong:'GV',soLuot:'0',loaiSach:k,soSach:String(n(v['g_'+k])),ghiChu:'',nguoiGhi:'nhap'})});
  const old=S.LuotDoc.filter(r=>r.ngay===d).map(r=>r.id);const ops=[];if(old.length)ops.push({t:'remove',table:'LuotDoc',keys:old});if(rows.length)ops.push({t:'upsert',table:'LuotDoc',rows});if(!ops.length)return toast('Không có gì để lưu');
  if(await commit(ops,'Đã lưu số liệu ngày '+vn(d))){DTV.thang=d.slice(0,7);pgTietDocMoi()}};

/* Nạp số liệu từ Sổ thống kê bạn đọc cũ (file Excel của trường) */
function parseSoTKBD(aoa){const s=v=>String(v??'').trim();const hr=aoa.findIndex(r=>r.some(c=>/Kh[ốo]i 6/i.test(s(c))));if(hr<0)return null;const out=[];const notes={};
  const num=v=>Math.max(0,parseInt(s(v).replace(/[^\d]/g,''))||0);let cy=0,cm=0,LASTM=0;
  const full=v=>{if(v instanceof Date&&!isNaN(v))return iso(new Date(v.getTime()+12*36e5));v=s(v);let m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return`${m[3]}-${z2(m[2])}-${z2(m[1])}`;if(/^\d{5}(\.\d+)?$/.test(v))return iso(new Date(Math.round((+v-25569)*864e5)+12*36e5));return''};
  for(let r=hr+1;r<aoa.length;r++){const row=aoa[r]||[];const a0=s(row[0]);if(/^Nh[ậa]n th[ựu]c/i.test(a0))break;
    const mh=a0.match(/^th[áa]ng\s*(\d{1,2})(?:\s*\/\s*(\d{4}))?/i);if(mh){cm=+mh[1];if(mh[2])cy=+mh[2];else if(cy&&cm<9&&LASTM>=9)cy++;LASTM=cm;continue}
    let d=full(row[0]);if(d){cy=+d.slice(0,4);cm=+d.slice(5,7);LASTM=cm}
    else if(/^\d{1,2}$/.test(a0)&&cm){let y=cy;if(!y)continue;d=`${y}-${z2(cm)}-${z2(a0)}`;if(isNaN(new Date(d+'T00:00:00')))continue}
    else continue;
    const b0=s(row[1]);if(b0&&!/^\d+$/.test(b0)){notes[d]=b0;continue}
    const dt=[['K6',1],['K7',2],['K8',3],['K9',4],['KXD',5],['GV',7]].map(([k,c])=>[k,num(row[c])]).filter(x=>x[1]);
    const hs=[['TK',9],['TN',10],['KHAC',11],['SGK',12],['BAO',13]].map(([k,c])=>[k,num(row[c])]).filter(x=>x[1]);const gv=[['TK',14],['NV',15],['TN',16],['KHAC',17],['SGK',18],['BAO',19]].map(([k,c])=>[k,num(row[c])]).filter(x=>x[1]);
    const tongI=num(row[8]);const sum=dt.reduce((a,x)=>a+x[1],0);if(!dt.length&&tongI)dt.push(['KXD',tongI]);
    if(dt.length||hs.length||gv.length)out.push({d,dt,hs,gv,sum:sum||tongI})}

async function xemPDF(title,b64){const m=modal('📖 '+esc(title),`<div class="pdfv" id="pdfV"><div class="muted" style="padding:20px;text-align:center">Đang mở tài liệu…</div></div>`,{wide:1,noOk:true,cancel:'Đóng',noFocus:true});

  if(!lib){const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const url=URL.createObjectURL(new Blob([u8],{type:'application/pdf'}));$('#pdfV',m.root).innerHTML=`<iframe src="${url}#toolbar=0" style="width:100%;height:72vh;border:0;background:#fff"></iframe>`;return}
  try{const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const doc=await lib.getDocument({data:u8}).promise;
    const box=$('#pdfV',m.root);box.innerHTML=`<div class="small muted" style="margin-bottom:6px">${doc.numPages} trang</div>`;box.oncontextmenu=e=>e.preventDefault();
    const w=Math.min(box.clientWidth||800,900);const io=new IntersectionObserver(async es=>{for(const e of es){if(!e.isIntersecting||e.target.dataset.ok)continue;e.target.dataset.ok=1;const p=await doc.getPage(+e.target.dataset.p);const v0=p.getViewport({scale:1});const sc=(w/v0.width)*(window.devicePixelRatio||1);const v=p.getViewport({scale:sc});
      const c=document.createElement('canvas');c.width=v.width;c.height=v.height;c.style.width='100%';e.target.innerHTML='';e.target.appendChild(c);await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise}},{root:box,rootMargin:'600px'});
    for(let i=1;i<=doc.numPages;i++){const d=document.createElement('div');d.className='pg';d.dataset.p=i;d.style.minHeight=Math.round(w*1.35)+'px';d.innerHTML=`<span class="muted small">Trang ${i}</span>`;box.appendChild(d);io.observe(d)}}
  catch(e){$('#pdfV',m.root).innerHTML=`<div style="color:var(--rd);padding:16px">Không mở được tài liệu: ${esc(e.message)}</div>`}}

let XP=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve(window.XLSX);if(XP)return XP;

function csvOf(rows){if(!rows.length)return'';const h=Object.keys(rows[0]);const q=v=>{v=String(v??'');return/[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return[h.map(q).join(','),...rows.map(r=>h.map(k=>q(r[k])).join(','))].join('\r\n')}
async function exportXlsx(name,sheets){busy(true);try{const X=await loadXLSX();const wb=X.utils.book_new();
  for(const [n,rows] of Object.entries(sheets)){const ws=X.utils.json_to_sheet(rows.length?rows:[{'(trống)':''}]);
   const h=Object.keys(rows[0]||{});ws['!cols']=h.map(k=>({wch:Math.min(60,Math.max(k.length+2,...rows.slice(0,200).map(r=>String(r[k]??'').length+1)))}));X.utils.book_append_sheet(wb,ws,n.slice(0,31))}
  X.writeFile(wb,name+'.xlsx')}
 catch(e){const [n,rows]=Object.entries(sheets)[0];const b=new Blob(['\ufeff'+csvOf(rows)],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.csv';a.click();toast('Không tải được thư viện Excel – đã xuất file CSV thay thế','err')}
 finally{busy(false)}}
function parseCSV(text){text=text.replace(/^\ufeff/,'');const dl=text.includes('\t')?'\t':[',',';'].sort((a,b)=>text.split(b).length-text.split(a).length)[0];
  const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];
   if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
   else if(ch==='"')q=true;else if(ch===dl){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}return aoaToRows(rows)}
function pickFileOnly(){return new Promise(res=>{const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls,.csv';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return res(null);busy(true);try{
    if(/\.csv$/i.test(f.name))return res(parseCSV(await f.text()));
    const X=await loadXLSX();const wb=X.read(await f.arrayBuffer(),{cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];
    // tìm dòng tiêu đề (bỏ qua các dòng tiêu đề trường/lớp ở đầu file)
