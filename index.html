<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f26522"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-title" content="Thư viện"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Thư viện số – Trường THCS Vĩnh Phước</title>
<style>
:root{--or:#f26522;--or2:#ff9142;--gr:#1aa64b;--nv:#0a1d33;--nv2:#12304f;--ag:#2f9e6e;--ag2:#e8f6ef;--bd:#e2e8f0;--tx:#1f2937;--mu:#6b7280;--bg:#f3f6f9;--rd:#dc2626;--bl:#2563eb}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);font-size:14px;background:#fff;line-height:1.45}
a{color:var(--bl);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.btn{border:1px solid var(--bd);background:#fff;padding:7px 13px;border-radius:7px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;transition:.15s}
.btn:hover{background:#f5f7fa}
.btn:disabled{opacity:.55;cursor:default}
.btn.pri{background:var(--ag);border-color:var(--ag);color:#fff}.btn.pri:hover{background:#278a5f}
.btn.or{background:var(--or);border-color:var(--or);color:#fff}.btn.or:hover{background:#dd561a}
.btn.dan{color:var(--rd);border-color:#fecaca}.btn.dan:hover{background:#fef2f2}
.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:6px}
.btn.link{border:0;background:none;color:var(--bl);padding:2px 4px}
.inp{border:1px solid var(--bd);border-radius:7px;padding:7px 10px;width:100%;background:#fff;outline:none}
.inp:focus{border-color:var(--ag);box-shadow:0 0 0 3px #2f9e6e22}
textarea.inp{resize:vertical}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl label{font-size:12.5px;font-weight:600;color:#374151}
.req{color:var(--rd);font-style:normal}
.chk{display:flex!important;gap:6px;align-items:center;font-weight:400!important;font-size:14px!important;cursor:pointer}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fgrid .full{grid-column:1/-1}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.t-ok{background:#dcfce7;color:#166534}.t-bo{background:#dbeafe;color:#1e40af}.t-wa{background:#fef3c7;color:#92400e}.t-er{background:#fee2e2;color:#991b1b}.t-mu{background:#f1f5f9;color:#475569}
.muted{color:var(--mu)}.small{font-size:12.5px}
.empty{padding:34px;text-align:center;color:var(--mu)}
#toast{position:fixed;right:18px;bottom:84px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.ts{background:#14532d;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px #0003;max-width:360px;animation:tin .2s}
.ts.err{background:#991b1b}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
#busy{position:fixed;inset:0;background:#ffffff88;z-index:9998;display:none;align-items:center;justify-content:center}
#busy.on{display:flex}
.spin{width:38px;height:38px;border:4px solid #d1fae5;border-top-color:var(--ag);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.demo{background:#fff7d6;color:#7c5a00;font-size:13px;padding:6px 14px;text-align:center;border-bottom:1px solid #f5e3a0}
/* modal */
.mo{position:fixed;inset:0;background:#0f172a80;z-index:900;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.md{background:#fff;border-radius:12px;width:min(620px,100%);box-shadow:0 20px 50px #0004;animation:tin .18s}
.md.wide{width:min(960px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd);font-size:16px}
.mh .x{border:0;background:none;font-size:24px;cursor:pointer;color:var(--mu);line-height:1}
.mb{padding:18px;max-height:calc(100vh - 210px);overflow:auto}
.mf{padding:12px 18px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
/* ===== PUBLIC ===== */
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.ph{background:#fff;border-bottom:1px solid #eee}
.ph-in{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;gap:10px;align-items:center;color:inherit}
.logo img,.logo .lg{width:46px;height:46px;border-radius:50%;object-fit:cover}
.lg{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ef4444,#f59e0b);color:#fff;font-size:22px}
.logo small{display:block;color:var(--gr);font-weight:700;font-size:14px}
.logo b{display:block;color:var(--or);font-size:18px;letter-spacing:.2px}
.ph-links{display:flex;gap:22px}
.ph-links a{display:flex;flex-direction:column;align-items:center;color:#374151;font-size:12.5px;gap:2px}
.ph-links .ic{font-size:18px;line-height:1}
.pn{background:var(--or);position:sticky;top:0;z-index:50;box-shadow:0 2px 6px #0002}
.pn .wrap{display:flex;flex-wrap:wrap}
.pn a{color:#fff;padding:13px 20px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.2px}
.pn a:hover,.pn a.on{background:#ffffff26}
.pn a.adm{background:var(--gr);text-transform:none;margin-left:auto}
.hero{background:radial-gradient(circle at 80% 20%,#ffd36b 0,transparent 40%),linear-gradient(120deg,#f26522,#ff9a3c 55%,#ffc04d);color:#fff;padding:54px 0 64px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-80px;bottom:-120px;width:420px;height:420px;border-radius:50%;background:#ffffff1c}
.hero h1{font-size:40px;font-weight:900;text-shadow:0 3px 0 #b8400f55;line-height:1.15}
.hero h1 small{display:block;font-size:22px;font-weight:700;opacity:.95}
.hero p{font-size:16px;max-width:560px;opacity:.95}
.hsearch{display:flex;background:#fff;border-radius:40px;padding:5px;max-width:600px;margin-top:22px;box-shadow:0 10px 30px #b8400f44;position:relative;z-index:2}
.hsearch input{flex:1;border:0;outline:0;padding:10px 18px;border-radius:40px;color:var(--tx);font-size:15px}
.hsearch button{border:0;background:var(--or);color:#fff;border-radius:40px;padding:0 24px;font-weight:700;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-34px;position:relative;z-index:3}
.st{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 6px 20px #0000140f,0 1px 3px #0001;display:flex;gap:12px;align-items:center}
.st .i{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.st b{font-size:24px;display:block;line-height:1.1}
.sec{margin:38px 0}
.sec h2{font-size:20px;color:var(--or);text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sec h2:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,#f2652255,transparent)}
.dmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.dmc{border:1px solid #fde1d3;background:#fff8f3;border-radius:12px;padding:14px;cursor:pointer;transition:.15s;color:inherit}
.dmc:hover{transform:translateY(-2px);box-shadow:0 6px 16px #f2652222}
.dmc b{display:block;font-size:13px;color:#9a3412}
.dmc span{font-size:12.5px;color:var(--mu)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.bk{cursor:pointer}
.bk .cv{width:100%;aspect-ratio:3/4;border-radius:8px;box-shadow:0 6px 14px #0002;transition:.2s}
.bk:hover .cv{transform:translateY(-4px)}
.bk b{display:block;font-size:13.5px;margin-top:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk span{font-size:12px;color:var(--mu)}
img.cv{object-fit:cover;background:#eee;display:block}
.ph-cv{display:flex;align-items:flex-end;padding:8px;color:#fff;font-weight:700;font-size:12px;line-height:1.25;overflow:hidden;text-shadow:0 1px 2px #0005}
.ph-cv span,.bk .ph-cv span{color:#fff;font-size:12px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pt{text-align:center;font-size:22px;margin:26px 0 18px;text-transform:uppercase;color:#1f2937}
.sbox{border:1px solid var(--bd);border-radius:10px;padding:16px;display:grid;grid-template-columns:170px 230px 1fr auto;gap:12px;align-items:end;background:#fff;box-shadow:0 2px 8px #0000000a}
.tclay{display:grid;grid-template-columns:240px 1fr;gap:20px;margin:18px 0 40px}
.dml{border:1px solid var(--bd);border-radius:10px;overflow:hidden;align-self:start}
.dml h4{margin:0;padding:10px 12px;background:#f8fafc;font-size:13.5px;border-bottom:1px solid var(--bd)}
.dml a{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-bottom:1px solid #f1f5f9;color:#374151;font-size:13px}
.dml a:hover{background:#fff7f2}
.dml a.on{background:var(--or);color:#fff}
.dml a i{font-style:normal;background:#64748b;color:#fff;border-radius:10px;padding:0 7px;font-size:11.5px;align-self:center}
.dml a.on i{background:#fff;color:var(--or)}
.ri{display:grid;grid-template-columns:86px 1fr 170px;gap:16px;padding:14px;border-bottom:1px solid #f1f5f9}
.ri .cv{width:86px;height:115px;border-radius:6px;box-shadow:0 3px 8px #0002}
.ri h3{font-size:15px;margin-bottom:6px}
.ri h3 a{color:var(--bl)}
.ri .meta{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px;font-size:12.5px;color:#4b5563}
.ri .meta b{color:#111827;font-weight:600}
.avail b{font-size:15px}
.pager{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;margin:14px 0}
.pager button{min-width:32px;height:32px;border:1px solid var(--bd);background:#fff;border-radius:6px;cursor:pointer}
.pager button.on{background:var(--ag);color:#fff;border-color:var(--ag)}
.pub .pager button.on{background:var(--or);border-color:var(--or)}
.pager .tot{margin-left:10px;color:var(--mu);font-size:12.5px}
.about{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin:10px 0 40px}
.about .card{border:1px solid var(--bd);border-radius:12px;padding:20px}
.about p{white-space:pre-line}
.pf{background:#1f2937;color:#cbd5e1;padding:26px 0;font-size:13px;margin-top:30px}
.pf b{color:#fff}
.dt{display:grid;grid-template-columns:170px 1fr;gap:20px}
.dt .cv{width:170px;height:226px;border-radius:8px;box-shadow:0 6px 14px #0002}
.dt table td{padding:4px 10px 4px 0;vertical-align:top}
.dt table td:first-child{color:var(--mu);white-space:nowrap}
/* ===== ADMIN ===== */
.ad{display:flex;min-height:100vh;background:var(--bg)}
.sb{width:232px;background:var(--nv);color:#cbd5e1;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.sb .brand{padding:14px 16px;display:flex;align-items:center;gap:10px;color:#fff;border-bottom:1px solid #ffffff14}
.sb .brand b{font-size:15px;display:block}
.sb .brand span{font-size:11.5px;color:#7dd3a8}
.sb nav{padding:10px 8px;flex:1}
.sb nav a{display:flex;gap:10px;align-items:center;color:#cbd5e1;padding:9px 12px;border-radius:8px;font-size:13.5px;margin-bottom:2px}
.sb nav a:hover{background:#ffffff12;color:#fff}
.sb nav a.on{background:var(--ag);color:#fff;font-weight:600}
.sb nav .grp{font-size:11px;text-transform:uppercase;color:#64748b;padding:12px 12px 4px;letter-spacing:.5px}
.sb .ft{padding:12px 16px;font-size:12px;color:#64748b;border-top:1px solid #ffffff14}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tb{background:var(--nv);color:#fff;height:50px;display:flex;align-items:center;gap:10px;padding:0 16px;position:sticky;top:0;z-index:40}
.tb .sp{flex:1}
.tb .btn{background:transparent;color:#fff;border-color:#ffffff40;padding:5px 11px;font-size:13px}
.tb .btn:hover{background:#ffffff18}
.tb .menu{display:none}
.ct{padding:18px;flex:1}
.phd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:14px;border:1px solid var(--bd)}
.phd h2{font-size:18px}
.phd p{margin:2px 0 0;color:var(--mu);font-size:12.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px}
.card.g{border-color:#9fd9bd}
.card h3{font-size:14.5px;margin-bottom:10px}
.filt{margin-bottom:14px}
.fr{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fr .fl{min-width:150px}
.fr .grow{flex:1;min-width:220px}
.split{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start}
.dmside a{display:flex;justify-content:space-between;padding:7px 9px;border-radius:6px;color:#374151;font-size:12.5px;gap:6px}
.dmside a:hover{background:#f1f5f9}
.dmside a.on{background:var(--ag2);color:#14532d;font-weight:600}
.dmside a i{font-style:normal;color:var(--mu)}
.tw{overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--ag);color:#fff;text-align:left;padding:9px 10px;font-weight:600;white-space:nowrap;position:sticky;top:0}
table.t td{padding:8px 10px;border-bottom:1px solid #eef2f6;vertical-align:middle}
table.t tr:nth-child(even) td{background:#fafcfd}
table.t tr:hover td{background:#f0faf5}
table.t .cv{width:40px;height:54px;border-radius:4px;padding:3px}
table.t .ph-cv span{font-size:6.5px!important;-webkit-line-clamp:3}
table.t td.c,table.t th.c{text-align:center}
table.t td.r,table.t th.r{text-align:right}
.ttl{color:var(--bl);font-weight:600;cursor:pointer}
.sub{font-size:12px;color:var(--mu);margin-top:2px;max-width:560px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kc{background:#fff;border:1px solid #9fd9bd;border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.kc b{font-size:26px;display:block;line-height:1.1}
.kc span{font-size:12.5px;color:var(--mu)}
.kc .i{font-size:28px;opacity:.85}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:16px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;min-width:0}
.bv{width:70%;max-width:38px;border-radius:5px 5px 0 0;position:relative;min-height:2px}
.bv span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;color:#374151}
.bl{font-size:11px;color:var(--mu);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hb{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.hb .tr{background:#eef2f6;border-radius:4px;height:14px;overflow:hidden}
.hb .tr div{height:100%;border-radius:4px}
.hb .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--nv),#14456b)}
.login .card{width:min(380px,92vw);padding:28px;border-radius:14px}
.login h2{font-size:20px;margin-bottom:4px}
.tabs{display:inline-flex;background:#eef2f6;border-radius:8px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600;color:#475569}
.tabs button.on{background:var(--ag);color:#fff}
.acw{position:relative}
.acl{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--bd);border-radius:8px;box-shadow:0 10px 24px #0002;z-index:30;max-height:280px;overflow:auto;display:none}
.acl.on{display:block}
.acl div{padding:8px 10px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:13px}
.acl div:hover,.acl div.hl{background:#f0faf5}
.rinfo{background:var(--ag2);border:1px solid #bfe6d2;border-radius:8px;padding:10px 12px;margin:8px 0}
.cart{margin:8px 0}
.cart .it{display:flex;justify-content:space-between;align-items:center;border:1px dashed #cbd5e1;border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);border-radius:6px;padding:2px 8px;font-size:12px;background:#fff}
.note{background:#f8fafc;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;font-size:13px;color:#475569}
.stats{grid-template-columns:repeat(5,1fr)}
.hgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:34px;align-items:center;position:relative;z-index:2}
.hban img{width:100%;border-radius:16px;box-shadow:0 14px 40px #b8400f55;display:block}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin-top:20px}
.tile{background:#ffffff2b;border:1px solid #ffffff66;color:#fff;border-radius:14px;padding:9px 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;transition:.15s}
.tile span{font-size:22px}.tile:hover{background:#fff;color:var(--or)}
.sec h2:after{order:2}.secmore{order:3;font-size:13px;text-transform:none;color:var(--or);font-weight:600}
.pgrid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pc{display:block;color:inherit;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 3px 12px #0000001a;transition:.2s}
.pc:hover{transform:translateY(-3px);box-shadow:0 10px 22px #00000024}
.pc>img,.pc>.ph-cv{width:100%;aspect-ratio:16/9;object-fit:cover;display:flex}
.pc>.ph-cv span{font-size:14px}.pc .hdc{align-items:center;justify-content:center}.pc .hdc span{font-size:26px;font-weight:900}
.pc .pcb{padding:10px 12px;display:flex;flex-direction:column}
.pc b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.35}
.pc.big b{font-size:16.5px}
.pc p{margin:6px 0;color:var(--mu);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .pcb>span{font-size:12px;color:var(--mu);margin-top:4px}
.art{max-width:860px;margin:0 auto 30px}
.art h1{font-size:26px;margin:14px 0 6px;color:#111;line-height:1.3}
.art .meta{color:var(--mu);font-size:13px;margin-bottom:14px}
.art .lead{font-weight:600;font-size:15.5px}
.art img.cover,.art .cimg{width:100%;border-radius:10px;margin:10px 0;display:block}
.art p,.art li{font-size:15.5px;line-height:1.7}
.art h3{color:#9a3412;margin:16px 0 4px}
.emb{width:100%;max-height:75vh;border-radius:8px;overflow:hidden;background:#000;margin:10px 0}
.emb iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.tngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tn{background:#fff;border-radius:12px;box-shadow:0 3px 12px #0000001a;overflow:hidden;cursor:pointer;transition:.2s;display:flex;flex-direction:column}
.tn:hover{transform:translateY(-3px);box-shadow:0 10px 22px #00000024}
.tn .ti{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:46px;overflow:hidden}
.tn .ti img{width:100%;height:100%;object-fit:cover}
.tn .tb2{padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.tn b{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chipbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;justify-content:center}
.chipbar button{border:1px solid #fed7c3;background:#fff7f2;color:#9a3412;border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:600}
.chipbar button.on{background:var(--or);color:#fff;border-color:var(--or)}

const cfgOf=arr=>{const o={};(arr||[]).forEach(r=>o[r.key]=r.value);return o};

function applyOps(db,ops){
  for(const op of ops){ if(op.t!=='assert')continue;
    const k=KEYS[op.table];const row=db[op.table].find(r=>String(r[k])===String(op.key));
    if(!row||String(row[op.field])!==String(op.equals))throw new Error(op.msg||'Dữ liệu đã thay đổi, hãy bấm Tải lại.');}
  for(const op of ops){const k=KEYS[op.table];
    if(op.t==='upsert'){const idx=new Map(db[op.table].map((r,i)=>[String(r[k]),i]));
      for(const row of op.rows){ if(op.table==='CaiDat'&&row.key==='matKhau'&&!String(row.value||'').trim())throw new Error('Mật khẩu không được để trống');
        const i=idx.get(String(row[k]));
        if(i!=null)db[op.table][i]={...db[op.table][i],...row};else{db[op.table].push({...row});idx.set(String(row[k]),db[op.table].length-1)}}}
    else if(op.t==='remove'){const set=new Set(op.keys.map(String));if(op.table==='CaiDat')set.delete('matKhau');db[op.table]=db[op.table].filter(r=>!set.has(String(r[k])))}}
}
function countCopies(ban){const dem={};let tong=0;for(const b of ban){if(b.tinhTrang==='Thanh lý'||b.tinhTrang==='Mất')continue;const c=dem[b.sachId]||(dem[b.sachId]={tong:0,san:0});c.tong++;tong++;if(b.tinhTrang==='Sẵn sàng')c.san++}return{dem,tong}}
function publicView(db){const {dem,tong}=countCopies(db.BanSach);const cfg=cfgOf(db.CaiDat);delete cfg.matKhau;
  return{ok:true,DanhMuc:db.DanhMuc,Sach:db.Sach,BaiViet:(db.BaiViet||[]).filter(r=>r.hien!=='0'),TaiNguyen:(db.TaiNguyen||[]).filter(r=>r.hien!=='0'),HoiDap:db.HoiDap||[],LienKet:db.LienKet||[],dem,cfg,bangVang:bangVangCalc(db,cfg),stats:{banSach:tong,banDoc:db.BanDoc.length,luotMuon:db.MuonTra.length}}}

    if(req.action==='log')return{ok:true,data:(db.NhatKy||[]).slice(-500)};
    if(req.action==='batch'){localCheckOps(req.ops,who);req.ops=clone(req.ops);localPrepTK(req.ops);const c=clone(db);applyOps(c,req.ops);const d=new Date();c.NhatKy=(c.NhatKy||[]).concat([{id:uid('L'),thoiGian:iso(d)+' '+d.toTimeString().slice(0,8),thietBi:(who.user+(who.user!=='admin'?' ('+who.hoTen+')':'')+(req.who?' · '+req.who:'')).slice(0,80),noiDung:String(req.note||'')+' ['+req.ops.filter(o=>o.t!=='assert').map(o=>o.table+(o.t==='remove'?' -'+o.keys.length:' '+o.rows.length)).join(', ')+']'}]).slice(-1000);this.db=c;this.save();return{ok:true}}
    throw new Error('Thao tác không hợp lệ')}

function modal(title,body,o={}){const m=document.createElement('div');m.className='mo';
  m.innerHTML=`<div class="md ${o.wide?'wide':''}"><div class="mh"><b>${title}</b><button class="x" title="Đóng">×</button></div><div class="mb">${body}</div><div class="mf">${o.extra||''}<button class="btn cl">${o.cancel||'Đóng'}</button>${o.noOk?'':`<button class="btn ${o.danger?'dan':'pri'} okb">${o.ok||'Lưu'}</button>`}</div></div>`;
  document.body.appendChild(m);let done=false;
  const close=()=>{m.remove();if(!done&&o.onClose)o.onClose()};
  m.querySelector('.x').onclick=close;m.querySelector('.cl').onclick=close;
  m.addEventListener('mousedown',e=>{if(e.target===m)close()});
  if(!o.noOk){const b=m.querySelector('.okb');b.onclick=async()=>{b.disabled=true;try{const r=await o.onOk(m.querySelector('.mb'));if(r!==false){done=true;close()}}catch(e){toast(e.message,'err')}finally{b.disabled=false}}}
  const f=m.querySelector('.mb input:not([type=checkbox]),.mb select');if(f&&!o.noFocus)setTimeout(()=>f.focus(),50);
  return{el:m.querySelector('.mb'),close,root:m}}
function ask(msg,ok='Đồng ý',danger=true){return new Promise(res=>modal('Xác nhận',`<p style="margin:0">${msg}</p>`,{ok,danger,noFocus:true,onOk:()=>res(true),onClose:()=>res(false)}))}
function fld(label,name,val='',o={}){const t=o.type||'text';let c;
  if(t==='select')c=`<select class="inp" name="${name}" ${o.attr||''}>${o.options.map(x=>`<option value="${esc(x[0])}" ${String(x[0])===String(val)?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`;
  else if(t==='textarea')c=`<textarea class="inp" name="${name}" rows="${o.rows||3}" ${o.ph?`placeholder="${esc(o.ph)}"`:''}>${esc(val)}</textarea>`;
  else if(t==='check')c=`<label class="chk"><input type="checkbox" name="${name}" ${val?'checked':''}> ${esc(o.text||'')}</label>`;
  else c=`<input class="inp" type="${t}" name="${name}" value="${esc(val)}" ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${o.attr||''}>`;
  return`<div class="fl ${o.cls||''}"><label>${label}${o.req?' <i class="req">*</i>':''}</label>${c}${o.hint?`<span class="small muted">${o.hint}</span>`:''}</div>`}
function vals(el){const o={};$$('[name]',el).forEach(i=>o[i.name]=i.type==='checkbox'?(i.checked?'1':''):i.value.trim());return o}
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}
function coverPh(t,cls){const h=hue(t);return`<div class="${cls} ph-cv" style="background:linear-gradient(160deg,hsl(${h} 65% 55%),hsl(${(h+40)%360} 60% 32%))"><span>${esc(t)}</span></div>`}
function cover(s,cls='cv'){return s.anhBia?`<img class="${cls}" src="${esc(s.anhBia)}" alt="" loading="lazy" data-t="${esc(s.nhanDe)}" onerror="this.outerHTML=coverPh(this.dataset.t,'${cls}')">`:coverPh(s.nhanDe,cls)}
function pager(total,st,fn){const n=Math.ceil(total/st.size)||1;if(st.page>n)st.page=n;const p=st.page;
  const btn=(i,l=i)=>`<button class="${i===p?'on':''}" ${i<1||i>n?'disabled':''} onclick="${fn}(${i})">${l}</button>`;
  let h=btn(p-1,'‹');const s=new Set([1,n,p-1,p,p+1,p-2,p+2]);let last=0;
  for(let i=1;i<=n;i++){if(!s.has(i))continue;if(i-last>1)h+='<span class="muted">…</span>';h+=btn(i);last=i}
  return`<div class="pager">${h+btn(p+1,'›')}<span class="tot">Tổng: ${total}</span></div>`}
const page=(list,st)=>list.slice((st.page-1)*st.size,st.page*st.size);
function demoBar(){return DEMO()?`<div class="demo">⚠ Đang chạy <b>chế độ dùng thử</b> – dữ liệu chỉ lưu trên trình duyệt này. Kết nối Google Sheets trong <a href="#/admin/thiet-lap">Quản trị › Thiết lập</a>.</div>`:''}
function bars(items,color='var(--ag)'){const max=Math.max(1,...items.map(i=>i.v));
  return`<div class="bars">${items.map(i=>`<div class="bar" title="${esc(i.l)}: ${i.v}"><div class="bv" style="height:${i.v/max*100}%;background:${color}"><span>${i.v||''}</span></div><div class="bl">${esc(i.l)}</div></div>`).join('')}</div>`}
function hbars(items,color='var(--ag)'){if(!items.length)return'<div class="empty">Chưa có dữ liệu</div>';const max=Math.max(1,...items.map(i=>i.v));
  return items.map(i=>`<div class="hb"><div class="lb" title="${esc(i.l)}">${esc(i.l)}</div><div class="tr"><div style="width:${i.v/max*100}%;background:${color}"></div></div><b class="r">${i.v}</b></div>`).join('')}
function matchQ(text,q){const t=norm(text);return norm(q).split(/\s+/).filter(Boolean).every(w=>t.includes(w))}
function bookText(s,by,dmMap){switch(by){case'nhanDe':return s.nhanDe;case'tacGia':return s.tacGia;case'nxb':return s.nxb;case'hashtag':return s.hashtag;case'soPhanLoai':return s.soPhanLoai;
  default:return[s.nhanDe,s.tacGia,s.nxb,s.hashtag,s.soPhanLoai,s.isbn,s.namXB,(dmMap[s.danhMucId]||{}).ten].join(' ')}}
const BY_OPTS=[['all','Toàn bộ'],['nhanDe','Nhan đề'],['tacGia','Tác giả'],['nxb','Nhà xuất bản'],['hashtag','Hashtag / Môn'],['soPhanLoai','Số phân loại']];
const mapBy=(arr,k)=>Object.fromEntries(arr.map(x=>[x[k],x]));
const sortDM=a=>[...a].sort((x,y)=>(+x.thuTu||99)-(+y.thuTu||99)||x.ten.localeCompare(y.ten,'vi'));

  <form class="sbox" onsubmit="event.preventDefault();TC.by=this.by.value;TC.dm=this.dm.value;TC.q=this.q.value;TC.page=1;fillTraCuu()">
   ${fld('Tìm theo','by',TC.by,{type:'select',options:BY_OPTS})}
   ${fld('Danh mục','dm',TC.dm,{type:'select',options:[['','Tất cả danh mục'],...dms.map(d=>[d.id,d.ten])]})}
   ${fld('Từ khóa','q',TC.q,{ph:'Nhập thông tin cần tra cứu (vd: tên sách, tác giả…)'})}
   <button class="btn or" style="height:37px">🔍 Tìm kiếm</button></form>
  <div class="tclay"><div class="dml" id="tcDm"></div><div id="tcRs"></div></div></div>`}
function fillTraCuu(){const dmMap=mapBy(P.DanhMuc,'id');
  const base=P.Sach.filter(s=>!TC.q||matchQ(bookText(s,TC.by,dmMap),TC.q));
  const cnt={};base.forEach(s=>cnt[s.danhMucId]=(cnt[s.danhMucId]||0)+1);

const SACH_COLS={nhanDe:['nhande','tensach','ten','tieude','nhandesach'],tacGia:['tacgia'],nxb:['nhaxuatban','nxb'],namXB:['namxuatban','namxb','nam'],gia:['gia','giabia','dongia'],
  danhMuc:['danhmuc','loaisach','loai'],soPhanLoai:['sophanloai','phanloai','kyhieuphanloai'],isbn:['isbn'],hashtag:['hashtag','mon','monhoc','tukhoa'],soLuong:['soluong','soban','sl','soluongban'],anhBia:['anhbia','linkanhbia','linkanh','anh'],moTa:['mota','tomtat'],nguon:['nguon','nguonnhap'],maCu:['mavach','mavachcu','madkcb','sodkcb','dkcb']};
function mapRow(r,cols){const nk={};for(const k in r){const a=norm(k).replace(/[^a-z0-9]/g,''),b=norm(String(k).replace(/\(.*?\)/g,'')).replace(/[^a-z0-9]/g,'');nk[a]=r[k];if(b&&nk[b]===undefined)nk[b]=r[k]}const o={};for(const f in cols){for(const a of cols[f])if(nk[a]!==undefined&&String(nk[a]).trim()!==''){o[f]=String(nk[a]).trim();break}if(o[f]===undefined)o[f]=''}return o}

A.nhapSach=async function(){const rows=await pickFileRows();if(!rows)return;const items=rows.map(r=>mapRow(r,SACH_COLS)).filter(r=>r.nhanDe);
  if(!items.length)return toast('Không đọc được dòng nào. Hãy dùng đúng tiêu đề cột như file mẫu.','err');
  const dmByName={};S.DanhMuc.forEach(d=>dmByName[norm(d.ten)]=d);const exist={};S.Sach.forEach(s=>exist[norm(s.nhanDe)+'|'+norm(s.nxb)]=s);
  const newDm=[],newS=[],newB=[];let addOnly=0;const t=today();let nextNo=0;const codes=genDKCB(items.reduce((a,r)=>a+Math.max(0,parseInt(r.soLuong)||0),0));
  let maxThu=Math.max(0,...S.DanhMuc.map(d=>+d.thuTu||0));const usedMC=new Set();
  for(const r of items){let dmId='';if(r.danhMuc){let d=dmByName[norm(r.danhMuc)];if(!d){d={id:uid('DM'),ten:r.danhMuc.toUpperCase(),thuTu:String(++maxThu)};dmByName[norm(r.danhMuc)]=d;newDm.push(d)}dmId=d.id}
    const key=norm(r.nhanDe)+'|'+norm(r.nxb);let s=exist[key];
    if(s)addOnly++;else{s={id:uid('S'),nhanDe:r.nhanDe,tacGia:r.tacGia,nxb:r.nxb,namXB:r.namXB,gia:r.gia.replace(/[^\d]/g,''),danhMucId:dmId,soPhanLoai:r.soPhanLoai||goiYDDC(r),isbn:r.isbn,hashtag:r.hashtag,anhBia:r.anhBia,moTa:r.moTa,noiBat:'',ngayTao:t};exist[key]=s;newS.push(s)}
    const mc=parseCodes(r.maCu).filter(x=>!findBan(x)&&!usedMC.has(norm(x)));mc.forEach(x=>{usedMC.add(norm(x));newB.push({dkcb:x,sachId:s.id,tinhTrang:'Sẵn sàng',ngayNhap:t,nguon:'Mã vạch cũ',ghiChu:''})});
    const n=Math.max(0,(parseInt(r.soLuong)||0)-mc.length);for(let i=0;i<n;i++)newB.push({dkcb:codes[nextNo++],sachId:s.id,tinhTrang:'Sẵn sàng',ngayNhap:t,nguon:r.nguon||'Mua',ghiChu:''})}
  modal('Nhập sách từ Excel',`<p>Đọc được <b>${items.length}</b> dòng:</p><ul><li><b>${newS.length}</b> đầu sách mới</li><li><b>${addOnly}</b> dòng trùng sách đã có (chỉ thêm bản)</li><li><b>${newB.length}</b> bản sách được cấp số ĐKCB ${newB.length?`(${esc(newB[0].dkcb)} → ${esc(newB[newB.length-1].dkcb)})`:''}</li>${newDm.length?`<li><b>${newDm.length}</b> danh mục mới: ${newDm.map(d=>esc(d.ten)).join(', ')}</li>`:''}</ul><p class="small muted">Sách trùng được nhận biết theo nhan đề + nhà xuất bản.</p>`,
   {ok:'Nhập dữ liệu',onOk:async()=>{const ops=[];if(newDm.length)ops.push({t:'upsert',table:'DanhMuc',rows:newDm});if(newS.length)ops.push({t:'upsert',table:'Sach',rows:newS});if(newB.length)ops.push({t:'upsert',table:'BanSach',rows:newB});
    if(!ops.length)return;if(!await commit(ops,'Đã nhập dữ liệu sách'))return false;rerender()}})};

function setupAC(inp,src,pick){const box=inp.nextElementSibling;let items=[],hl=0;
  const show=()=>{const q=inp.value.trim();if(!q){box.classList.remove('on');return}items=src(q);hl=0;
    box.innerHTML=items.map((x,i)=>`<div data-i="${i}" class="${i===0?'hl':''}">${x.h}</div>`).join('')||'<div class="muted">Không tìm thấy</div>';box.classList.add('on')};
  inp.oninput=show;inp.onfocus=show;inp.onblur=()=>setTimeout(()=>box.classList.remove('on'),180);
  box.onmousedown=e=>{const d=e.target.closest('[data-i]');if(d){e.preventDefault();box.classList.remove('on');pick(items[+d.dataset.i].v)}};
  inp.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hl=Math.max(0,Math.min(items.length-1,hl+(e.key==='ArrowDown'?1:-1)));$$('[data-i]',box).forEach((d,i)=>d.classList.toggle('hl',i===hl))}
    if(e.key==='Enter'){e.preventDefault();items=src(inp.value.trim());const ex=items.find(x=>x.exact);const it=ex||items[hl]||items[0];if(it){box.classList.remove('on');pick(it.v)}}}}

/* ---------- Nhúng nội dung ---------- */
function embedOf(u){u=String(u||'').trim();if(!u)return null;let m;
  if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/))return{t:'frame',src:'https://www.youtube.com/embed/'+m[1],r:'16/9',yt:m[1]};
  if(m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/))return{t:'frame',src:'https://drive.google.com/file/d/'+m[1]+'/preview',r:'4/3'};
  if(m=u.match(/docs\.google\.com\/(document|presentation|spreadsheets|forms)\/d\/(e\/)?([\w-]+)/))return{t:'frame',src:`https://docs.google.com/${m[1]}/d/${m[2]||''}${m[3]}/${m[1]==='forms'?'viewform?embedded=true':'preview'}`,r:'4/3'};
  if(/\.(mp3|m4a|wav|ogg)(\?|$)/i.test(u))return{t:'audio',src:u};
  if(/\.(mp4|webm)(\?|$)/i.test(u))return{t:'video',src:u};
  if(/\.pdf(\?|$)/i.test(u))return{t:'frame',src:u,r:'3/4'};
  return{t:'link',src:u}}
function mediaHTML(u){const e=embedOf(u);if(!e)return'<div class="empty">Chưa có liên kết nội dung.</div>';
  if(e.t==='frame')return`<div class="emb" style="aspect-ratio:${e.r}"><iframe src="${esc(e.src)}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`;
  if(e.t==='audio')return`<audio controls style="width:100%;margin:10px 0" src="${esc(e.src)}"></audio>`;
  if(e.t==='video')return`<video controls style="width:100%;border-radius:8px;margin:10px 0" src="${esc(e.src)}"></video>`;
  return`<div class="note" style="margin:10px 0">Nội dung nằm ở trang web bên ngoài. <a class="btn or sm" style="margin-left:6px" href="${esc(e.src)}" target="_blank" rel="noopener">Mở nội dung ↗</a></div>`}
function thumbOf(t){if(t.anh)return t.anh;const e=embedOf(t.link);return e&&e.yt?`https://img.youtube.com/vi/${e.yt}/hqdefault.jpg`:''}
function linkify(s){return s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function renderContent(t){return String(t||'').replace(/\r/g,'').split(/\n\s*\n/).map(b=>{const l=b.trim();if(!l)return'';
  if(/^https?:\/\/\S+$/.test(l)){if(/\.(jpe?g|png|gif|webp)(\?\S*)?$/i.test(l)||/googleusercontent\.com/.test(l))return`<img class="cimg" src="${esc(l)}" alt="">`;const e=embedOf(l);if(e&&e.t!=='link')return mediaHTML(l)}
  if(/^#{1,3}\s/.test(l)){const [h,...r]=l.split('\n');return`<h3>${esc(h.replace(/^#+\s*/,''))}</h3>`+(r.length?`<p>${linkify(esc(r.join('\n'))).replace(/\n/g,'<br>')}</p>`:'')}
  return`<p>${linkify(esc(b)).replace(/\n/g,'<br>')}</p>`}).join('')}
function imgOr(src,t,cls=''){return src?`<img class="${cls}" src="${esc(src)}" alt="" loading="lazy" data-t="${esc(t)}" onerror="this.outerHTML=coverPh(this.dataset.t,'${cls}')">`:coverPh(t,cls)}

/* ---------- Mã vạch Code 39 ---------- */
const C39={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn','F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn','K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn','U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','$':'nwnwnwnnn','/':'nwnwnnnwn','+':'nwnnnwnwn','%':'nnnwnwnwn','*':'nwnnwnwnn'};
function code39(txt,dir){const s='*'+norm(txt).toUpperCase().replace(/[^0-9A-Z\-. $\/+%]/g,'')+'*';let x=10,r='';
  for(const ch of s){const p=C39[ch];for(let i=0;i<9;i++){const w=p[i]==='w'?3:1;if(i%2===0)r+=dir==='v'?`<rect x="0" y="${x}" width="40" height="${w}"/>`:`<rect x="${x}" y="0" width="${w}" height="40"/>`;x+=w}x+=1}x+=9;
  return dir==='v'?`<svg viewBox="0 0 40 ${x}" preserveAspectRatio="none">${r}</svg>`:`<svg viewBox="0 0 ${x} 40" preserveAspectRatio="none">${r}</svg>`}
function kyHieuTG(s){const a=norm((s.tacGia||'').split(/[,(;]/)[0]).replace(/[^a-z ]/g,'').trim();const t=norm(s.nhanDe||'').replace(/^(sgk|sgv|sbt)\s+/,'').replace(/[^a-z ]/g,'').trim();
  const first=a?a.split(/\s+/)[0]:t.split(/\s+/)[0]||'';return(first.slice(0,2)+'-'+(t[0]||'')).toUpperCase()}

  case'so':return[`Hệ thống: ${a.tn} tài nguyên số / ${a.tn+a.ds} đầu tài liệu ≈ ${f(a.pctSo)}% (tính theo đầu tài liệu, chỉ để tham khảo)`,a.pctSo>=35];

/* ================== GIAI ĐOẠN 3: CỔNG BẠN ĐỌC, ĐẶT MƯỢN, KIỂM KÊ, THANH LÝ, TRUY CẬP, TRỢ LÝ ================== */
function pinOk(r,pin){pin=String(pin||'').trim();if(!pin)return false;if(r.pin)return pin===String(r.pin);const m=String(r.ngaySinh||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return pin===m[3]+m[2]+m[1];return pin.toUpperCase()===String(r.ma).toUpperCase()}
function readerLocal(db,req){const ma=String(req.ma||'').trim().toUpperCase();const r=db.BanDoc.find(b=>String(b.ma).toUpperCase()===ma);
  if(!r||!pinOk(r,req.pin))throw new Error('Sai mã bạn đọc hoặc mật khẩu');const c={...DEF_CFG,...cfgOf(db.CaiDat)};const sub=req.sub||'info';
  if(sub==='datmuon'){const open=db.DatMuon.filter(d=>d.maBanDoc===r.ma&&d.trangThai==='Chờ');const max=+(r.loai==='GV'?c.toiDaGV:c.toiDaHS)||3;
    if(open.length>=max)throw new Error('Bạn chỉ được đặt trước tối đa '+max+' cuốn cùng lúc');if(open.some(d=>d.sachId===req.sachId))throw new Error('Bạn đã đặt mượn sách này rồi');
    if(!db.Sach.some(s=>s.id===req.sachId))throw new Error('Không tìm thấy sách');db.DatMuon.push({id:uid('D'),maBanDoc:r.ma,sachId:req.sachId,ngay:today(),trangThai:'Chờ',ghiChu:String(req.ghiChu||'').slice(0,200)})}
  else if(sub==='huy'){const d=db.DatMuon.find(x=>x.id===req.id&&x.maBanDoc===r.ma&&x.trangThai==='Chờ');if(!d)throw new Error('Không hủy được yêu cầu này');d.trangThai='Đã hủy'}
  else if(sub==='doipin'){const p=String(req.pinMoi||'').trim();if(p.length<4)throw new Error('Mật khẩu mới tối thiểu 4 ký tự');r.pin=p}
  const pick=(o,ks)=>Object.fromEntries(ks.map(k=>[k,o[k]]));
  return{ok:true,ban:pick(r,['ma','hoTen','loai','lop']),muon:db.MuonTra.filter(m=>m.maBanDoc===r.ma).map(m=>pick(m,['id','dkcb','sachId','ngayMuon','hanTra','ngayTra','trangThai'])),dat:db.DatMuon.filter(d=>d.maBanDoc===r.ma).map(d=>({...d}))}}
async function readerCall(req){if(DEMO()){const db=Local.load();const r=readerLocal(db,req);Local.save();if(S){S.DatMuon=clone(db.DatMuon);S.BanDoc=clone(db.BanDoc)}return r}
  const res=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...req,action:'reader'})});const j=await res.json();if(!j.ok)throw new Error(j.error||'Lỗi máy chủ');return j}
function hitOnce(){if(SS.get('tv_hit'))return;SS.set('tv_hit','1');if(DEMO())Local.hit();else fetch(apiUrl+(apiUrl.includes('?')?'&':'?')+'action=hit').catch(()=>{})}

   <div class="card"><h3>📌 Sách đặt mượn trước</h3>${dat.length?dat.map(x=>`<div class="rdi"><div><b>${esc((sm[x.sachId]||{}).nhanDe||'(sách đã xóa)')}</b><div class="small muted">Đặt ngày ${vn(x.ngay)}${x.ghiChu?' · '+esc(x.ghiChu):''}</div></div><span style="white-space:nowrap"><span class="tag ${DTC[x.trangThai]||'t-mu'}">${esc(x.trangThai==='Chờ'?'Chờ thư viện':x.trangThai)}</span>${x.trangThai==='Chờ'?` <button class="btn sm" onclick="rdHuy('${esc(x.id)}')">Hủy</button>`:''}</span></div>`).join(''):'<div class="empty" style="padding:20px">Chưa đặt mượn sách nào.<br>Tìm sách ở mục Tra cứu và bấm “📌 Đặt mượn”.</div>'}

  <div class="card" style="margin-top:16px"><h3>🕘 Lịch sử mượn (${ls.length})</h3>${ls.length?`<div class="tw"><table class="t"><tr><th>Tên sách</th><th>Số ĐKCB</th><th>Ngày mượn</th><th>Ngày trả</th></tr>${ls.slice(0,100).map(m=>`<tr><td>${esc((sm[m.sachId]||{}).nhanDe)}</td><td>${esc(m.dkcb)}</td><td>${vn(m.ngayMuon)}</td><td>${vn(m.ngayTra)}</td></tr>`).join('')}</table></div>`:'<div class="muted">Chưa có</div>'}</div></div>`}

/* ---------- Trợ lý thư viện (trả lời tự động theo dữ liệu thư viện) ---------- */
const BOT_STOP=new Set('tim kiem sach cho minh em toi co khong ko nao the la gi o dau muon quyen cuon ve cua voi va hay oi a thu vien can xin hoi biet duoc nhe nha vay sao lam nhu bao nhieu khi nay day dang tai lieu ban'.split(' '));
function botOpen(){const b=$('#bot');if(!b)return;b.classList.toggle('on');if(b.classList.contains('on')){if(!$('#botM').children.length)botSay(`Xin chào! Mình là trợ lý tự động của thư viện ${esc(getCfg().tenTruong)}. Bạn có thể hỏi về giờ mở cửa, cách mượn sách, hoặc gõ tên sách / môn học để mình tìm giúp.`,['Giờ mở cửa?','Mượn sách thế nào?','Tìm sách Tin học 8','Có video bài giảng không?']);setTimeout(()=>$('#botI').focus(),50)}}
function botSay(html,chips){const m=$('#botM');m.insertAdjacentHTML('beforeend',`<div class="bm b">${html}${chips?`<div class="bch">${chips.map(c=>`<button onclick="botAsk(this.textContent)">${esc(c)}</button>`).join('')}</div>`:''}</div>`);m.scrollTop=m.scrollHeight}
function botAsk(q){q=String(q||'').trim();if(!q)return;$('#botM').insertAdjacentHTML('beforeend',`<div class="bm u">${esc(q)}</div>`);$('#botI').value='';setTimeout(()=>botSay(botAnswer(q)),250)}
function botAnswer(q){const c=getCfg(),nq=norm(q),out=[];const has=re=>re.test(nq);
  if(has(/gio|mo cua|dong cua|may gio|lich phuc vu|thoi gian/))out.push(`🕘 <b>Giờ mở cửa:</b><br>${esc(c.gioMoCua).replace(/\n/g,'<br>')}`);
  if(has(/muon|tra sach|gia han|bao lau|may cuon|bao nhieu cuon|han tra|qua han/))out.push(`📋 Học sinh mượn tối đa <b>${esc(c.toiDaHS)} cuốn</b> trong <b>${esc(c.ngayMuonHS)} ngày</b>; giáo viên tối đa ${esc(c.toiDaGV)} cuốn trong ${esc(c.ngayMuonGV)} ngày. Bạn có thể <a href="#/ban-doc">đăng nhập Cổng bạn đọc</a> để xem hạn trả và đặt mượn trước.`);
  if(has(/noi quy|quy dinh|lam mat|hu hong|boi thuong/))out.push('📕 Xem đầy đủ tại <a href="#/noi-quy">Nội quy thư viện</a>.');
  if(has(/mat khau|dang nhap|tai khoan|cong ban doc/))out.push('👤 Vào <a href="#/ban-doc">Cổng bạn đọc</a>, nhập mã bạn đọc (in trên thẻ thư viện). Mật khẩu lần đầu là ngày sinh viết liền (vd: 15032012). Quên mật khẩu thì liên hệ thư viện để được cấp lại.');
  const words=nq.split(/[^a-z0-9]+/).filter(w=>w.length>1);
  let best=null,bs=0;(P.HoiDap||[]).forEach(h=>{const hw=new Set(norm(h.cauHoi).split(/[^a-z0-9]+/).filter(w=>w.length>1&&!BOT_STOP.has(w)));if(!hw.size)return;const sc=words.filter(w=>hw.has(w)).length/hw.size;if(sc>bs){bs=sc;best=h}});
  if(best&&bs>=0.5&&!out.length)out.push(`💡 <b>${esc(best.cauHoi)}</b><br>${linkify(esc(best.traLoi)).replace(/\n/g,'<br>')}`);
  const kw=words.filter(w=>!BOT_STOP.has(w));
  if(kw.length&&!(out.length&&kw.length<2)){const q2=kw.join(' ');const dmMap=mapBy(P.DanhMuc,'id');
    let bk=P.Sach.filter(s=>matchQ(bookText(s,'all',dmMap),q2));if(!bk.length)bk=P.Sach.map(s=>[s,kw.filter(w=>norm(bookText(s,'all',dmMap)).includes(w)).length]).filter(x=>x[1]>=Math.ceil(kw.length/2)).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    if(bk.length)out.push(`📚 Mình tìm thấy ${bk.length} đầu sách:`+bk.slice(0,4).map(s=>{const d=P.dem[s.id]||{tong:0,san:0};return`<div class="bres" onclick="showBook('${esc(s.id)}')"><b>${esc(s.nhanDe)}</b><span style="color:${d.san?'var(--gr)':'var(--rd)'}">Sẵn sàng ${d.san}/${d.tong}</span></div>`}).join('')+(bk.length>4?`<a href="#/tra-cuu?q=${encodeURIComponent(q2)}&dm=">Xem tất cả kết quả →</a>`:''));
    const tn=(P.TaiNguyen||[]).filter(t=>kw.some(w=>norm([t.tieuDe,t.mon,t.chuDe,(LTN[t.loai]||{}).ten].join(' ')).includes(w))).map(t=>[t,kw.filter(w=>norm([t.tieuDe,t.mon,t.chuDe,(LTN[t.loai]||{}).ten].join(' ')).includes(w)).length]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    if(tn.length)out.push(`💾 Tài nguyên số liên quan:`+tn.slice(0,3).map(t=>`<div class="bres" onclick="openTN('${esc(t.id)}')"><b>${(LTN[t.loai]||{}).ic||''} ${esc(t.tieuDe)}</b><span>${esc((LTN[t.loai]||{}).ten||'')}</span></div>`).join(''))}
  if(!out.length)return`Mình chưa tìm thấy thông tin phù hợp 😅. Bạn thử gõ <b>tên sách, tác giả hoặc môn học</b>, xem <a href="#/hoi-dap">Câu hỏi thường gặp</a>, hoặc hỏi trực tiếp thầy cô ở thư viện nhé.`;
  return out.join('<hr>')}

/* ---------- Quản trị: kiểm kê ---------- */
const KK={id:'',tab:'thieu',buf:[],log:[]};
function kkScanned(id){const s=new Set(S.KiemKeCT.filter(x=>x.kiemKeId===id).map(x=>String(x.dkcb).toUpperCase()));KK.buf.forEach(x=>s.add(x));return s}
function kkResult(id){const sc=kkScanned(id);const all=S.BanSach.filter(b=>b.tinhTrang!=='Thanh lý'&&b.tinhTrang!=='Mất');const map=new Map(S.BanSach.map(b=>[String(b.dkcb).toUpperCase(),b]));
  const thay=[],dang=[],thieu=[];all.forEach(b=>{const k=String(b.dkcb).toUpperCase();if(sc.has(k))thay.push(b);else if(b.tinhTrang==='Đang mượn')dang.push(b);else thieu.push(b)});
  const la=[...sc].filter(k=>!map.has(k)||['Thanh lý','Mất'].includes(map.get(k).tinhTrang));return{all,thay,dang,thieu,la,map}}
function beep(ok){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?880:220;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+(ok?.08:.25));setTimeout(()=>a.close(),400)}catch(e){}}
function pgKiemKe(){KK.buf=[];KK.log=[];if(KK.id&&S.KiemKe.some(k=>k.id===KK.id))return pgKiemKeCT();KK.id='';
  const cnt={};S.KiemKeCT.forEach(x=>cnt[x.kiemKeId]=(cnt[x.kiemKeId]||0)+1);const l=[...S.KiemKe].sort((a,b)=>String(b.ngayBatDau).localeCompare(String(a.ngayBatDau)));
  $('#ct').innerHTML=`<div class="phd"><div><h2>Kiểm kê sách</h2><p>Quét mã vạch / nhập số ĐKCB từng cuốn trên kệ; hệ thống tự đối chiếu với sổ đăng ký cá biệt để tìm sách thiếu và in biên bản kiểm kê</p></div><div class="acts"><button class="btn pri" onclick="A.taoKK()">＋ Tạo đợt kiểm kê</button></div></div>
  <div class="card" style="padding:0"><div class="tw"><table class="t"><tr><th>Đợt kiểm kê</th><th>Ngày bắt đầu</th><th>Trạng thái</th><th class="c">Đã quét</th><th>Kết quả</th><th class="c">Thao tác</th></tr>
  ${l.map(k=>{let kq={};try{kq=JSON.parse(k.ketQua||'{}')}catch(e){}return`<tr><td><span class="ttl" onclick="KK.id='${esc(k.id)}';pgKiemKe()">${esc(k.ten)}</span><div class="sub">${esc(k.ghiChu)}</div></td><td>${vn(k.ngayBatDau)}</td><td>${k.trangThai==='Đã chốt'?`<span class="tag t-ok">Đã chốt ${vn(k.ngayChot)}</span>`:'<span class="tag t-wa">Đang kiểm</span>'}</td><td class="c">${cnt[k.id]||0}</td>
   <td class="small">${kq.tong!=null?`Tổng ${kq.tong} · Có ${kq.thay} · Đang mượn ${kq.dang} · <b style="color:var(--rd)">Thiếu ${kq.thieu}</b>`:''}</td><td class="c" style="white-space:nowrap"><button class="btn sm pri" onclick="KK.id='${esc(k.id)}';pgKiemKe()">Mở</button> <button class="btn sm dan" onclick="A.xoaKK('${esc(k.id)}')">🗑</button></td></tr>`}).join('')||'<tr><td colspan=6 class="empty">Chưa có đợt kiểm kê nào</td></tr>'}</table></div></div>
  <div class="note" style="margin-top:12px">💡 Quy trình: Tạo đợt → mang máy tính/điện thoại có máy quét đến từng kệ, quét mã vạch trên nhãn sách (hoặc gõ số ĐKCB rồi Enter) → bấm Lưu định kỳ → xem danh sách thiếu → Chốt kiểm kê & in biên bản. Sách đang cho mượn được tính là có trong kho.</div>`}
A.taoKK=()=>modal('Tạo đợt kiểm kê',`<div class="fgrid">${fld('Tên đợt','ten','Kiểm kê cuối năm học '+namHocNow(),{req:1,cls:'full'})}${fld('Ngày bắt đầu','ngay',today(),{type:'date'})}${fld('Ghi chú','gc','')}</div>`,{ok:'Tạo',onOk:async el=>{const v=vals(el);if(!v.ten)throw new Error('Nhập tên');const id=uid('KK');
  if(!await commit([{t:'upsert',table:'KiemKe',rows:[{id,ten:v.ten,ngayBatDau:v.ngay||today(),ngayChot:'',trangThai:'Đang kiểm',ghiChu:v.gc,ketQua:''}]}],'Đã tạo đợt kiểm kê'))return false;KK.id=id;pgKiemKe()}});
A.xoaKK=async id=>{if(!await ask('Xóa đợt kiểm kê này và toàn bộ dữ liệu đã quét? (Không ảnh hưởng tình trạng sách)','Xóa'))return;
  if(await commit([{t:'remove',table:'KiemKe',keys:[id]},{t:'remove',table:'KiemKeCT',keys:S.KiemKeCT.filter(x=>x.kiemKeId===id).map(x=>x.id)}],'Đã xóa')){KK.id='';pgKiemKe()}};
function pgKiemKeCT(){const k=S.KiemKe.find(x=>x.id===KK.id);const done=k.trangThai==='Đã chốt';
  $('#ct').innerHTML=`<div class="phd"><div><h2>📋 ${esc(k.ten)}</h2><p>Bắt đầu ${vn(k.ngayBatDau)} · ${done?`<span class="tag t-ok">Đã chốt ${vn(k.ngayChot)}</span>`:'<span class="tag t-wa">Đang kiểm</span>'}</p></div><div class="acts"><button class="btn" onclick="A.roiKK()">← Danh sách đợt</button><button class="btn" onclick="A.inKK()">🖨 In biên bản</button>${done?'':'<button class="btn pri" onclick="A.chotKK()">✔ Chốt kiểm kê</button>'}</div></div>
  ${done?'':`<div class="g2 g32"><div class="card g"><h3>Quét / nhập số ĐKCB</h3><input class="inp" id="kkI" style="font-size:20px;padding:12px;letter-spacing:1px" placeholder="Quét mã vạch hoặc gõ số ĐKCB rồi Enter" autocomplete="off">
   <div class="acts" style="margin-top:10px"><button class="btn" onclick="A.camKK()">📷 Quét bằng camera</button><button class="btn" onclick="A.danKK()">📋 Dán danh sách</button><button class="btn" onclick="A.excelKK()">📥 Từ file Excel</button><span id="kkBuf" class="tag t-wa" style="align-self:center"></span><button class="btn pri" id="kkSave" onclick="A.luuKK()">💾 Lưu</button></div><div id="kkLog" style="margin-top:10px"></div></div>
   <div class="card g" id="kkSum"></div></div>`}${done?'<div class="card g" id="kkSum" style="margin-bottom:14px"></div>':''}
  <div class="card" style="padding:0;margin-top:14px"><div style="padding:12px 14px"><div class="tabs" id="kkTabs"></div></div><div id="kkTb"></div></div>`;
  if(!done){const i=$('#kkI');i.focus();i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();A.quetKK(i.value);i.value=''}}}
  fillKK()}
function fillKK(){const R=kkResult(KK.id);const sm=mapBy(S.Sach,'id'),dmMap=mapBy(S.DanhMuc,'id');
  const pct=R.all.length?Math.round((R.thay.length+R.dang.length)/R.all.length*100):0;
  $('#kkSum').innerHTML=`<h3>Tiến độ</h3><div class="kkbar"><div style="width:${pct}%"></div></div><div class="small muted" style="margin:4px 0 10px">${pct}% bản sách đã được đối chiếu</div>
   <div class="kkst"><div><b>${R.all.length}</b><span>Cần kiểm</span></div><div><b style="color:var(--ag)">${R.thay.length}</b><span>Đã thấy</span></div><div><b style="color:var(--bl)">${R.dang.length}</b><span>Đang mượn</span></div><div><b style="color:var(--rd)">${R.thieu.length}</b><span>Chưa thấy</span></div><div><b style="color:#a16207">${R.la.length}</b><span>Mã lạ</span></div></div>`;
  if($('#kkBuf')){$('#kkBuf').textContent=KK.buf.length?`Chưa lưu: ${KK.buf.length}`:'Đã lưu hết';$('#kkBuf').className='tag '+(KK.buf.length?'t-wa':'t-ok')}
  if($('#kkLog'))$('#kkLog').innerHTML=KK.log.slice(-8).reverse().map(x=>`<div class="kkl ${x[1]}"><b>${esc(x[0])}</b> ${esc(x[2])}</div>`).join('');
  const tabs=[['thieu','Chưa thấy',R.thieu.length],['thay','Đã thấy',R.thay.length],['dang','Đang mượn',R.dang.length],['la','Mã lạ',R.la.length]];
  $('#kkTabs').innerHTML=tabs.map(x=>`<button class="${KK.tab===x[0]?'on':''}" onclick="KK.tab='${x[0]}';fillKK()">${x[1]} (${x[2]})</button>`).join('');
  if(KK.tab==='la'){$('#kkTb').innerHTML=`<div class="tw"><table class="t"><tr><th>Mã đã quét</th><th>Ghi chú</th></tr>${R.la.map(k=>{const b=R.map.get(k);return`<tr><td><b>${esc(k)}</b></td><td>${b?`Bản sách đã ở tình trạng "${esc(b.tinhTrang)}" – kiểm tra lại`:`Không có trong sổ đăng ký cá biệt (nhãn sai hoặc sách chưa biên mục) <button class="btn sm" onclick="A.themMaCu('${esc(k)}',()=>fillKK())">➕ Thêm vào kho</button>`}</td></tr>`}).join('')||'<tr><td colspan=2 class="empty">Không có</td></tr>'}</table></div>`;return}
  const l=(KK.tab==='thieu'?R.thieu:KK.tab==='thay'?R.thay:R.dang).sort((a,b)=>String(a.dkcb).localeCompare(String(b.dkcb),'vi',{numeric:true}));
  $('#kkTb').innerHTML=`<div class="tw" style="max-height:480px"><table class="t"><tr><th>Số ĐKCB</th><th>Tên sách</th><th>Danh mục</th><th>Tình trạng</th><th>Ngày nhập</th></tr>${l.slice(0,500).map(b=>{const s=sm[b.sachId]||{};return`<tr><td><b>${esc(b.dkcb)}</b></td><td>${esc(s.nhanDe)}</td><td class="small">${esc((dmMap[s.danhMucId]||{}).ten)}</td><td><span class="tag ${TTC[b.tinhTrang]}">${esc(b.tinhTrang)}</span></td><td>${vn(b.ngayNhap)}</td></tr>`}).join('')||'<tr><td colspan=5 class="empty">Không có</td></tr>'}</table>${l.length>500?`<div class="small muted" style="padding:8px">Hiển thị 500/${l.length} dòng – in biên bản để xem đủ</div>`:''}</div>`}
A.quetKK=function(v){const codes=String(v).split(/[\s,;]+/).map(x=>x.trim().toUpperCase()).filter(Boolean);if(!codes.length)return;const sc=kkScanned(KK.id);const map=new Map(S.BanSach.map(b=>[String(b.dkcb).toUpperCase(),b]));const sm=mapBy(S.Sach,'id');let ok=true;
  codes.forEach(c=>{if(sc.has(c)){KK.log.push([c,'dup','– đã quét trước đó']);return}sc.add(c);KK.buf.push(c);const b=map.get(c);
    if(!b){ok=false;KK.log.push([c,'err','– không có trong sổ ĐKCB'])}else if(['Thanh lý','Mất'].includes(b.tinhTrang)){ok=false;KK.log.push([c,'err',`– đang ghi "${b.tinhTrang}"`])}else KK.log.push([c,'ok','– '+((sm[b.sachId]||{}).nhanDe||'')])});
  if(codes.length===1)beep(ok&&KK.log[KK.log.length-1][1]==='ok');fillKK();if(KK.buf.length>=25)A.luuKK()};

A.roiKK=async()=>{if(KK.buf.length&&await ask(`Còn ${KK.buf.length} mã chưa lưu. Lưu trước khi rời? (Bấm Đóng để bỏ các mã chưa lưu)`,'Lưu',false))await A.luuKK();KK.id='';pgKiemKe()};
A.danKK=()=>modal('Dán danh sách số ĐKCB',`${fld('Mỗi dòng một số ĐKCB (hoặc cách nhau bởi dấu phẩy)','ds','',{type:'textarea',rows:10})}`,{ok:'Thêm',onOk:async el=>{A.quetKK(vals(el).ds);await A.luuKK()}});
A.excelKK=async()=>{const rows=await pickFileRows();if(!rows)return;const codes=[];rows.forEach(r=>{const k=Object.keys(r).find(x=>/dkcb|dang ky|ma vach|so dk/.test(norm(x)))||Object.keys(r)[0];if(r[k])codes.push(r[k])});A.quetKK(codes.join(' '));await A.luuKK()};

   ${R.thieu.length?fld('','mat',true,{type:'check',text:`Chuyển ${R.thieu.length} bản chưa thấy sang tình trạng "Mất"`}):''}<p class="small muted">Sau khi chốt, đợt kiểm kê không quét thêm được nữa. Có thể in biên bản bất cứ lúc nào.</p>`,
   {ok:'Chốt kiểm kê',onOk:async el=>{const v=vals(el);const kq={tong:R.all.length,thay:R.thay.length,dang:R.dang.length,thieu:R.thieu.length,la:R.la.length,dsThieu:R.thieu.slice(0,2000).map(b=>b.dkcb)};

A.inKK=function(){const k=S.KiemKe.find(x=>x.id===KK.id);let kq={};try{kq=JSON.parse(k.ketQua||'{}')}catch(e){}const sm=mapBy(S.Sach,'id');
  let R;if(k.trangThai==='Đã chốt'&&kq.dsThieu){const set=new Set(kq.dsThieu);R={thieu:S.BanSach.filter(b=>set.has(b.dkcb)),tong:kq.tong,thay:kq.thay,dang:kq.dang}}else{const r=kkResult(KK.id);R={thieu:r.thieu,tong:r.all.length,thay:r.thay.length,dang:r.dang.length}}
  const dmC={};const sDm={};S.Sach.forEach(s=>sDm[s.id]=s.danhMucId);R.thieu.forEach(b=>{const d=sDm[b.sachId];dmC[d]=dmC[d]||{n:0,g:0};dmC[d].n++;dmC[d].g+=+(sm[b.sachId]||{}).gia||0});

  `<p>Hội đồng kiểm kê gồm: ……………………………………………………………………………………………</p><h2 class="dt2">1. Kết quả chung</h2><table class="dtb"><tr><th>Tổng số bản sách theo sổ ĐKCB</th><th>Có mặt trên kệ</th><th>Đang cho mượn</th><th>Thiếu</th><th>Giá trị sách thiếu (đ)</th></tr>
  <tr><td class="c">${R.tong}</td><td class="c">${R.thay}</td><td class="c">${R.dang}</td><td class="c"><b>${R.thieu.length}</b></td><td class="r">${tg.toLocaleString('vi-VN')}</td></tr></table>
  <h2 class="dt2">2. Sách thiếu theo danh mục</h2><table class="dtb"><tr><th>Danh mục</th><th>Số bản thiếu</th><th>Giá trị (đ)</th></tr>${Object.entries(dmC).map(([d,o])=>`<tr><td>${esc((S.DanhMuc.find(x=>x.id===d)||{}).ten||'Chưa phân loại')}</td><td class="c">${o.n}</td><td class="r">${o.g.toLocaleString('vi-VN')}</td></tr>`).join('')||'<tr><td colspan=3 class="c">Không có</td></tr>'}</table>

function pgThanhLy(){const l=[...S.ThanhLy].sort((a,b)=>String(b.ngay).localeCompare(String(a.ngay)));
  $('#ct').innerHTML=`<div class="phd"><div><h2>Thanh lý sách</h2><p>Lập biên bản thanh lý các bản sách hư hỏng, lạc hậu hoặc bị mất; bản sách được chuyển sang tình trạng "Thanh lý"</p></div><div class="acts"><button class="btn pri" onclick="A.taoTL()">＋ Lập biên bản thanh lý</button></div></div>
  <div class="card" style="padding:0"><div class="tw"><table class="t"><tr><th>Số biên bản</th><th>Ngày</th><th>Lý do</th><th class="c">Số bản</th><th class="r">Tổng giá trị</th><th class="c">Thao tác</th></tr>
  ${l.map(x=>`<tr><td><b>${esc(x.soBB)}</b><div class="sub">${esc(x.ghiChu)}</div></td><td>${vn(x.ngay)}</td><td>${esc(x.lyDo)}</td><td class="c">${String(x.ds||'').split(';').filter(Boolean).length}</td><td class="r">${(+x.tongGia||0).toLocaleString('vi-VN')}đ</td>
   <td class="c" style="white-space:nowrap"><button class="btn sm" onclick="A.inTL('${esc(x.id)}')">🖨 In</button> <button class="btn sm dan" onclick="A.xoaTL('${esc(x.id)}')">🗑</button></td></tr>`).join('')||'<tr><td colspan=6 class="empty">Chưa có biên bản thanh lý</td></tr>'}</table></div></div>`}
function tlParse(txt){const map=new Map(S.BanSach.map(b=>[String(b.dkcb).toUpperCase(),b]));const seen=new Set(),ok=[],bad=[];
  String(txt).split(/[\s,;]+/).map(x=>x.trim().toUpperCase()).filter(Boolean).forEach(c=>{if(seen.has(c))return;seen.add(c);const b=map.get(c);if(!b)bad.push([c,'không có trong sổ ĐKCB']);else if(b.tinhTrang==='Đang mượn')bad.push([c,'đang cho mượn']);else if(b.tinhTrang==='Thanh lý')bad.push([c,'đã thanh lý']);else ok.push(b)});return{ok,bad}}
A.taoTL=function(){const y=new Date().getFullYear();const n=S.ThanhLy.filter(x=>String(x.soBB).includes('/'+y)).length+1;
  const m=modal('Lập biên bản thanh lý',`<div class="fgrid">${fld('Số biên bản','soBB',`${String(n).padStart(2,'0')}/BB-TL/${y}`)}${fld('Ngày','ngay',today(),{type:'date'})}
   ${fld('Lý do thanh lý','lyDo','Sách rách nát, hư hỏng không sử dụng được',{type:'select',cls:'full',options:['Sách rách nát, hư hỏng không sử dụng được','Sách lạc hậu, nội dung không còn phù hợp chương trình','Sách bị mất','SGK cũ không còn sử dụng (thay đổi chương trình)','Lý do khác'].map(x=>[x,x])})}
   ${fld('Danh sách số ĐKCB cần thanh lý','ds','',{type:'textarea',rows:6,cls:'full',hint:'Quét mã vạch hoặc gõ / dán số ĐKCB, mỗi dòng một số'})}${fld('Ghi chú','ghiChu','',{cls:'full'})}</div>
   <div class="acts" style="margin:8px 0"><button type="button" class="btn sm" onclick="A.camTL()">📷 Quét bằng camera</button><button type="button" class="btn sm" onclick="A.tlThem('Hỏng')">＋ Thêm tất cả bản "Hỏng"</button><button type="button" class="btn sm" onclick="A.tlThem('Mất')">＋ Thêm tất cả bản "Mất"</button></div><div id="tlPv" class="small"></div>`,
   {wide:1,ok:'Lập biên bản',onOk:async el=>{const v=vals(el);const {ok,bad}=tlParse(v.ds);if(!ok.length)throw new Error('Chưa có bản sách hợp lệ');if(bad.length&&!await ask(`${bad.length} mã không hợp lệ sẽ bị bỏ qua. Tiếp tục?`,'Tiếp tục',false))return false;
    const sm=mapBy(S.Sach,'id');const id=uid('TL');const tong=ok.reduce((a,b)=>a+(+(sm[b.sachId]||{}).gia||0),0);
    const ops=ok.filter(b=>b.tinhTrang!=='Đang mượn').map(b=>({t:'assert',table:'BanSach',key:b.dkcb,field:'tinhTrang',equals:b.tinhTrang,msg:'Tình trạng bản '+b.dkcb+' vừa thay đổi, hãy Tải lại'}));
    ops.push({t:'upsert',table:'ThanhLy',rows:[{id,soBB:v.soBB,ngay:v.ngay||today(),lyDo:v.lyDo,ds:ok.map(b=>b.dkcb+'|'+b.tinhTrang).join(';'),tongGia:String(tong),ghiChu:v.ghiChu}]});
    ops.push({t:'upsert',table:'BanSach',rows:ok.map(b=>({dkcb:b.dkcb,tinhTrang:'Thanh lý',ghiChu:'Thanh lý theo BB '+v.soBB}))});
    if(!await commit(ops,`Đã thanh lý ${ok.length} bản sách`))return false;pgThanhLy();A.inTL(id)}});
  const ta=$('textarea[name=ds]',m.el);const pv=()=>{const {ok,bad}=tlParse(ta.value);$('#tlPv').innerHTML=`<span class="tag t-ok">${ok.length} bản hợp lệ</span>${bad.length?` <span class="tag t-er">${bad.length} không hợp lệ</span> `+bad.slice(0,10).map(x=>`${esc(x[0])} (${x[1]})`).join(', '):''}`};ta.oninput=debounce(pv,200);pv()};
A.tlThem=tt=>{const ta=$('.mo textarea[name=ds]');const cur=new Set(ta.value.split(/[\s,;]+/).map(x=>x.toUpperCase()));const add=S.BanSach.filter(b=>b.tinhTrang===tt&&!cur.has(String(b.dkcb).toUpperCase())).map(b=>b.dkcb);
  if(!add.length)return toast(`Không có bản "${tt}" nào`,'err');ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+add.join('\n');ta.dispatchEvent(new Event('input'))};
A.xoaTL=async id=>{const x=S.ThanhLy.find(y=>y.id===id);const ds=String(x.ds||'').split(';').filter(Boolean).map(s=>s.split('|'));
  if(!await ask(`Xóa biên bản <b>${esc(x.soBB)}</b>? ${ds.length} bản sách sẽ được trả về tình trạng trước khi thanh lý.`,'Xóa biên bản'))return;
  if(await commit([{t:'remove',table:'ThanhLy',keys:[id]},{t:'upsert',table:'BanSach',rows:ds.filter(d=>S.BanSach.some(b=>b.dkcb===d[0])).map(d=>({dkcb:d[0],tinhTrang:d[1]||'Hỏng',ghiChu:''}))}],'Đã xóa biên bản'))pgThanhLy()};
A.inTL=id=>{const x=S.ThanhLy.find(y=>y.id===id);if(!x)return;const sm=mapBy(S.Sach,'id'),bm=new Map(S.BanSach.map(b=>[b.dkcb,b]));const ds=String(x.ds||'').split(';').filter(Boolean).map(s=>s.split('|'));
  printHTML('Bien ban thanh ly',docHead('BIÊN BẢN THANH LÝ SÁCH, TÀI LIỆU THƯ VIỆN',`Số: ${esc(x.soBB)} – ngày ${vn(x.ngay)}`)+
  `<p>Hôm nay, ngày ${vn(x.ngay)}, Hội đồng thanh lý sách thư viện ${esc(getCfg().tenTruong)} gồm:</p><p>1. ………………………………… – Chủ tịch hội đồng</p><p>2. ………………………………… – Thành viên</p><p>3. ………………………………… – Thư ký (người làm thư viện)</p>
  <p>Đã tiến hành kiểm tra và thống nhất thanh lý các bản sách sau. Lý do: <b>${esc(x.lyDo)}</b>.</p>
  <table class="dtb"><tr><th>STT</th><th>Số ĐKCB</th><th>Tên sách</th><th>Tác giả</th><th>Nhà XB</th><th>Năm XB</th><th>Giá (đ)</th><th>Tình trạng</th></tr>${ds.map((d,i)=>{const b=bm.get(d[0])||{};const s=sm[b.sachId]||{};return`<tr><td class="c">${i+1}</td><td>${esc(d[0])}</td><td>${esc(s.nhanDe)}</td><td>${esc((s.tacGia||'').split(/[,(]/)[0])}</td><td>${esc(s.nxb)}</td><td class="c">${esc(s.namXB)}</td><td class="r">${s.gia?(+s.gia).toLocaleString('vi-VN'):''}</td><td>${esc(d[1])}</td></tr>`}).join('')}
  <tr><td colspan=6 class="r"><b>Tổng cộng: ${ds.length} bản</b></td><td class="r"><b>${(+x.tongGia||0).toLocaleString('vi-VN')}</b></td><td></td></tr></table>${x.ghiChu?`<p>Ghi chú: ${esc(x.ghiChu)}</p>`:''}
  <p>Hình thức xử lý sau thanh lý: ……………………………………………………………………………</p><p>Biên bản lập thành 02 bản, 01 bản lưu tại thư viện, 01 bản lưu tại bộ phận kế toán.</p>
  <div class="sig" style="margin-top:20px"><div><b>THƯ KÝ</b></div><div><b>THÀNH VIÊN</b></div><div><b>CHỦ TỊCH HỘI ĐỒNG</b></div></div>`,'','size:A4;margin:12mm')};

function truyCapHTML(){const t=today();const m=new Map(S.TruyCap.map(x=>[x.id,+x.luot||0]));const days=[];for(let i=13;i>=0;i--){const d=addDays(t,-i);days.push({l:d.slice(8)+'/'+d.slice(5,7),v:m.get(d)||0})}
  const sum30=[...Array(30)].reduce((a,_,i)=>a+(m.get(addDays(t,-i))||0),0);

function batDauSteps(){const c=getCfg();return[
 ['Điền thông tin trường (địa chỉ, cơ quan cấp trên…)','#/admin/thiet-lap',!!(c.diaChi||c.capTren||c.diaDanh)],
 ['Kết nối Google Sheets để dữ liệu lưu online','#/admin/thiet-lap',!DEMO()],

 ['Lập kế hoạch hoạt động thư viện năm học '+namHocNow(),'#/admin/so-tay',c['keHoach'+namHocNow()]==='1'],

function batDauHTML(){if(getCfg().anBatDau==='1')return'';const st=batDauSteps();const n=st.filter(x=>x[2]).length;if(n===st.length)return'';
  return`<div class="card bd0"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3 style="margin:0">🚀 Bắt đầu nhanh – ${n}/${st.length} việc đã xong</h3><button class="btn sm link" onclick="A.anBatDau()">Ẩn khung này</button></div>
  <div class="kkbar" style="margin:10px 0"><div style="width:${n/st.length*100}%"></div></div><div class="bdl">${st.map((x,i)=>`<a href="${x[1]}" class="${x[2]?'ok':''}"><span>${x[2]?'✔':i+1}</span>${esc(x[0])}</a>`).join('')}</div></div>`}

async function isbnLookup(isbn){isbn=String(isbn).replace(/[^0-9Xx]/g,'');if(isbn.length<10)throw new Error('Mã ISBN gồm 10 hoặc 13 chữ số');
  try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn);const j=await r.json();const v=j.items&&j.items[0]&&j.items[0].volumeInfo;
    if(v)return{nhanDe:[v.title,v.subtitle].filter(Boolean).join(': '),tacGia:(v.authors||[]).join(', '),nxb:v.publisher||'',namXB:String(v.publishedDate||'').slice(0,4),anhBia:((v.imageLinks||{}).thumbnail||'').replace(/^http:/,'https:'),moTa:(v.description||'').slice(0,1000)}}catch(e){}
  try{const r=await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);const j=await r.json();const v=j['ISBN:'+isbn];
    if(v)return{nhanDe:[v.title,v.subtitle].filter(Boolean).join(': '),tacGia:(v.authors||[]).map(a=>a.name).join(', '),nxb:((v.publishers||[])[0]||{}).name||'',namXB:(String(v.publish_date||'').match(/\d{4}/)||[''])[0],anhBia:(v.cover||{}).medium||'',moTa:''}}catch(e){}
  if(isNXBGD(isbn))return{nhanDe:'',tacGia:'',nxb:'Giáo dục Việt Nam',namXB:'',anhBia:'',moTa:''};
  throw new Error('Không tìm thấy thông tin cho ISBN này (sách Việt Nam đôi khi chưa có dữ liệu trực tuyến) – hãy nhập tay.')}

const SCAN={stream:null,timer:null,det:null,zx:null,last:'',lastT:0,cb:null};
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{s.remove();rej(new Error('Không tải được thư viện quét (cần Internet)'))};document.head.appendChild(s)})}
function scanEmit(code){code=String(code||'').trim().replace(/^\*|\*$/g,'');if(!code||!SCAN.cb)return;const t=Date.now();if(/^\d{12,13}$/.test(code)&&!(code===SCAN.last&&t-SCAN.lastT<2500)){if(SCAN.pend!==code||t-SCAN.pendT>1500){SCAN.pend=code;SCAN.pendT=t;return}SCAN.pend=''}if(code===SCAN.last&&t-SCAN.lastT<2500)return;SCAN.last=code;SCAN.lastT=t;try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}SCAN.cb(code)}
async function scanStart(video,onCode){scanStop();SCAN.cb=onCode;SCAN.last='';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error(location.protocol==='https:'?'Trình duyệt không hỗ trợ camera':'Camera chỉ hoạt động khi mở trang qua https:// (ví dụ địa chỉ GitHub Pages)');
  video.setAttribute('playsinline','');video.muted=true;
  if('BarcodeDetector' in window){let fm=['code_39','code_128','ean_13','ean_8','upc_a','qr_code','codabar'];try{const sup=await BarcodeDetector.getSupportedFormats();fm=fm.filter(f=>sup.includes(f))}catch(e){}
    if(fm.length){SCAN.det=new BarcodeDetector({formats:fm});
      SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
      video.srcObject=SCAN.stream;await video.play();
      const loop=async()=>{if(!SCAN.stream)return;try{if(video.readyState>=2){const r=await SCAN.det.detect(video);if(r.length)scanEmit(r[0].rawValue)}}catch(e){}SCAN.timer=setTimeout(loop,110)};loop();
      try{const tr=SCAN.stream.getVideoTracks()[0];const cap=tr.getCapabilities&&tr.getCapabilities();if(cap&&cap.focusMode&&cap.focusMode.includes('continuous'))tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
      return'native'}}
  if(!window.ZXing)await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js');
  SCAN.zx=new ZXing.BrowserMultiFormatReader();
  await SCAN.zx.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},video,(res)=>{if(res)scanEmit(res.getText())});return'zxing'}
function scanStop(){clearTimeout(SCAN.timer);SCAN.cb=null;if(SCAN.stream){SCAN.stream.getTracks().forEach(t=>t.stop());SCAN.stream=null}if(SCAN.zx){try{SCAN.zx.reset()}catch(e){}SCAN.zx=null}}
function camErrMsg(e){const n=e&&e.name;if(n==='NotAllowedError')return'Bạn đã chặn quyền camera. Vào biểu tượng 🔒 cạnh địa chỉ trang › Quyền › Camera › Cho phép, rồi thử lại.';

async function qcMuon(){const r=QC.reader,c=getCfg(),t=today();if(!r||!QC.cart.length)return;const ln=loansOf(r.ma),max=+(r.loai==='GV'?c.toiDaGV:c.toiDaHS);

  ops.push({t:'upsert',table:'BanSach',rows:cart.map(dk=>({dkcb:dk,tinhTrang:'Đang mượn'}))});
  const datN=S.DatMuon.filter(d=>d.maBanDoc===r.ma&&d.trangThai==='Chờ'&&cart.some(dk=>(S.BanSach.find(b=>b.dkcb===dk)||{}).sachId===d.sachId));
  if(datN.length)ops.push({t:'upsert',table:'DatMuon',rows:datN.map(d=>({id:d.id,trangThai:'Đã nhận'}))});
  ops.push({t:'upsert',table:'MuonTra',rows:cart.map(dk=>({id:uid('M'),dkcb:dk,sachId:S.BanSach.find(b=>b.dkcb===dk).sachId,maBanDoc:r.ma,ngayMuon:t,hanTra:han,ngayTra:'',trangThai:'Đang mượn',ghiChu:boNote('QC',dk),bo:boOf('QC',dk)}))});
  QC.busy=true;const ok=await commit(ops,`Đã cho ${r.hoTen} mượn ${cart.length} cuốn`);QC.busy=false;
  if(ok){QC.reader=null;QC.cart=[];qcMsg('✔ Xong! Quét thẻ bạn đọc tiếp theo',true);fillQC()}}

  const newBD=[],newS=[],newB=[],loans=[],kq=[];const usedMa=[];const bdBy=new Map(S.BanDoc.map(b=>[norm(b.ma),b]));const bdName=new Map(S.BanDoc.map(b=>[norm(b.hoTen)+'|'+norm(b.lop),b]));

  if(b.tinhTrang!=='Sẵn sàng'){qcMsg(`${b.dkcb} đang "${b.tinhTrang}" – không cho mượn được`,false);return}

async function qcMuon(){const r=QC.reader,c=getCfg(),t=today();if(!r||!QC.cart.length)return;const ln=loansOf(r.ma),max=+(r.loai==='GV'?c.toiDaGV:c.toiDaHS);

async function qcNhap(code){const sm=mapBy(S.Sach,'id');
  if(/^https?:\/\//i.test(code)){QC.busy=true;try{await qcQR(code)}finally{QC.busy=false}return}
  if(isISBN(code)){const s=S.Sach.find(x=>isbnEq(x.isbn,code));if(s){QC.nhapS=s.id;qcMsg('✔ Sách đã có: '+s.nhanDe,true);return fillQC()}
    qcMsg('Đang tìm thông tin ISBN…',true);let d={};try{d=await isbnLookup(code)}catch(e){}if(!d.nxb&&isNXBGD(code))d.nxb='Giáo dục Việt Nam';const same=d.nhanDe&&S.Sach.find(x=>!x.isbn&&norm(x.nhanDe)===norm(d.nhanDe));if(same){await commit([{t:'upsert',table:'Sach',rows:[{id:same.id,isbn:code}]}],'');QC.nhapS=same.id;qcMsg('✔ Sách đã có: '+same.nhanDe+' – đã lưu thêm ISBN',true);return fillQC()}return qcSachMoi(code,d)}
  const b=findBan(code);if(b){qcMsg(`${b.dkcb} đã có trong kho: ${(sm[b.sachId]||{}).nhanDe||''}`,false);return}
  if(!looksCode(code)){qcMsg(code+' – không phải mã hợp lệ',false);return}
  if(QC.nhapS){QC.busy=true;const ok=await commit([{t:'upsert',table:'BanSach',rows:[{dkcb:code,sachId:QC.nhapS,tinhTrang:'Sẵn sàng',ngayNhap:today(),nguon:'Mã vạch cũ',ghiChu:''}]}],'');QC.busy=false;
    if(ok){QC.nhapN++;QC.log.unshift({ok:true,t:code+' → '+((sm[QC.nhapS]||{}).nhanDe||'')});qcMsg('✔ Đã thêm bản '+code,true)}return fillQC()}
  beep(false);A.themMaCu(code,nb=>{QC.nhapS=nb.sachId;QC.nhapN++;QC.log.unshift({ok:true,t:code+' → '+((mapBy(S.Sach,'id')[nb.sachId]||{}).nhanDe||'')});qcMsg('✔ Đã thêm bản '+code,true);fillQC()})}

async function qcKK(code){if(!QC.kkId){qcMsg('Hãy chọn hoặc tạo đợt kiểm kê trước',false);return}KK.id=QC.kkId;

  if(!b){ok=false;KK.log.push([c,'err','– không có trong sổ ĐKCB']);qcMsg(c+' – mã lạ, không có trong kho',false)}
  else if(['Thanh lý','Mất'].includes(b.tinhTrang)){ok=false;KK.log.push([c,'err',`– đang ghi "${b.tinhTrang}"`]);qcMsg(`${c} – đang ghi "${b.tinhTrang}"`,false)}
  else{KK.log.push([c,'ok','– '+((sm[b.sachId]||{}).nhanDe||'')]);qcMsg('✔ '+((sm[b.sachId]||{}).nhanDe||c),true)}

A.nhatKy=async function(){busy(true);let l=[];try{l=(await BE().post({action:'log',pass:PASS})).data||[]}catch(e){busy(false);return handleErr(e)}busy(false);
  l=l.slice().reverse();const m=modal('📜 Nhật ký thao tác (500 thao tác gần nhất)',`<input class="inp" id="nkQ" placeholder="Lọc theo nội dung, thiết bị, ngày…" style="margin-bottom:8px"><div class="tw" style="max-height:60vh"><table class="t" id="nkT"></table></div>
   <p class="small muted">Mỗi lần lưu dữ liệu đều được ghi lại: thời gian, tên thiết bị/người dùng (đặt ở Thiết lập) và nội dung thao tác. Nhật ký đầy đủ nằm ở trang tính NhatKy trong Google Sheets.</p>`,{wide:1,noOk:true});
  const fill=()=>{const q=$('#nkQ').value.trim();$('#nkT').innerHTML='<tr><th>Thời gian</th><th>Thiết bị / người dùng</th><th>Nội dung</th></tr>'+l.filter(x=>!q||matchQ(x.thoiGian+' '+x.thietBi+' '+x.noiDung,q)).slice(0,500).map(x=>`<tr><td style="white-space:nowrap">${esc(x.thoiGian)}</td><td>${esc(x.thietBi)}</td><td class="small">${esc(x.noiDung)}</td></tr>`).join('')||'<tr><td colspan=3 class="empty">Chưa có</td></tr>'};
  $('#nkQ').oninput=debounce(fill,150);fill()};
function dlIssues(){const sIds=new Set(S.Sach.map(s=>s.id)),rIds=new Set(S.BanDoc.map(b=>b.ma));const banBy=new Map(S.BanSach.map(b=>[b.dkcb,b]));
  const seen=new Map(),dupCase=[];S.BanSach.forEach(b=>{const k=norm(b.dkcb);if(seen.has(k))dupCase.push(seen.get(k)+' / '+b.dkcb);else seen.set(k,b.dkcb)});
  const open=S.MuonTra.filter(m=>m.trangThai==='Đang mượn');const openBy={};open.forEach(m=>(openBy[m.dkcb]=openBy[m.dkcb]||[]).push(m));
  const dbl=Object.values(openBy).filter(a=>a.length>1);const dblClose=dbl.flatMap(a=>a.sort((x,y)=>String(y.ngayMuon).localeCompare(String(x.ngayMuon))).slice(1));
  const orphan=S.BanSach.filter(b=>!sIds.has(b.sachId));
  const ghost=S.BanSach.filter(b=>b.tinhTrang==='Đang mượn'&&!openBy[b.dkcb]);
  const lost=open.filter(m=>!dblClose.includes(m)&&(!banBy.get(m.dkcb)||banBy.get(m.dkcb).tinhTrang!=='Đang mượn'));
  const badTT=S.BanSach.filter(b=>!TT.includes(b.tinhTrang));
  const noDate=open.filter(m=>!/^\d{4}-\d{2}-\d{2}$/.test(m.hanTra||''));
  const noReader=open.filter(m=>!rIds.has(m.maBanDoc));
  const noKey=S.Sach.filter(s=>!String(s.nhanDe||'').trim());
  const t=today();const I=[];
  I.push({ten:'Một cuốn sách có 2 phiếu mượn đang mở',n:dblClose.length,mau:dblClose.map(m=>m.dkcb),cach:'Giữ phiếu mới nhất, đóng các phiếu cũ',ops:dblClose.length?[{t:'upsert',table:'MuonTra',rows:dblClose.map(m=>({id:m.id,trangThai:'Đã trả',ngayTra:t,ghiChu:'Đóng tự động (trùng phiếu)'}))}]:[]});
  I.push({ten:'Bản sách ghi "Đang mượn" nhưng không có phiếu mượn',n:ghost.length,mau:ghost.map(b=>b.dkcb),cach:'Chuyển về "Sẵn sàng"',ops:ghost.length?[{t:'upsert',table:'BanSach',rows:ghost.map(b=>({dkcb:b.dkcb,tinhTrang:'Sẵn sàng'}))}]:[]});
  const lostFix=lost.filter(m=>banBy.get(m.dkcb)&&!['Thanh lý'].includes(banBy.get(m.dkcb).tinhTrang)),lostClose=lost.filter(m=>!lostFix.includes(m));
  I.push({ten:'Phiếu đang mượn nhưng bản sách không ở tình trạng "Đang mượn"',n:lost.length,mau:lost.map(m=>m.dkcb),cach:'Đặt lại bản sách thành "Đang mượn"; phiếu của sách đã xóa/thanh lý thì đóng lại',
    ops:[...(lostFix.length?[{t:'upsert',table:'BanSach',rows:lostFix.map(m=>({dkcb:m.dkcb,tinhTrang:'Đang mượn'}))}]:[]),...(lostClose.length?[{t:'upsert',table:'MuonTra',rows:lostClose.map(m=>({id:m.id,trangThai:'Đã trả',ngayTra:t,ghiChu:'Đóng tự động (bản sách không còn)'}))}]:[])]});
  I.push({ten:'Bản sách thuộc đầu sách đã bị xóa',n:orphan.length,mau:orphan.map(b=>b.dkcb),cach:'Gom vào đầu sách "(Chưa rõ tên – cần bổ sung)" để sửa sau',
    ops:orphan.length?[...(sIds.has('S_CHUARO')?[]:[{t:'upsert',table:'Sach',rows:[{id:'S_CHUARO',nhanDe:'(Chưa rõ tên – cần bổ sung)',tacGia:'',nxb:'',namXB:'',gia:'',danhMucId:'',soPhanLoai:'',isbn:'',hashtag:'',anhBia:'',moTa:'Đầu sách tạm do công cụ Kiểm tra dữ liệu tạo',noiBat:'',ngayTao:t}]}]),{t:'upsert',table:'BanSach',rows:orphan.map(b=>({dkcb:b.dkcb,sachId:'S_CHUARO'}))}]:[]});
  I.push({ten:'Tình trạng bản sách không hợp lệ',n:badTT.length,mau:badTT.map(b=>b.dkcb+': '+b.tinhTrang),cach:'Đặt thành "Sẵn sàng"',ops:badTT.length?[{t:'upsert',table:'BanSach',rows:badTT.map(b=>({dkcb:b.dkcb,tinhTrang:'Sẵn sàng'}))}]:[]});
  I.push({ten:'Phiếu đang mượn thiếu/sai hạn trả',n:noDate.length,mau:noDate.map(m=>m.dkcb),cach:'Đặt hạn trả = ngày mượn + số ngày quy định',ops:noDate.length?[{t:'upsert',table:'MuonTra',rows:noDate.map(m=>({id:m.id,hanTra:addDays(/^\d{4}-\d{2}-\d{2}$/.test(m.ngayMuon||'')?m.ngayMuon:t,getCfg().ngayMuonHS)}))}]:[]});
  I.push({ten:'Phiếu đang mượn của bạn đọc đã bị xóa',n:noReader.length,mau:noReader.map(m=>m.maBanDoc+' – '+m.dkcb),cach:'Chỉ báo – thêm lại bạn đọc với đúng mã hoặc trả sách',ops:[]});
  I.push({ten:'Số ĐKCB trùng nhau (chỉ khác chữ hoa/thường)',n:dupCase.length,mau:dupCase,cach:'Chỉ báo – sửa/xóa một trong hai ở mục Bản sách',ops:[]});
  I.push({ten:'Đầu sách không có nhan đề',n:noKey.length,mau:noKey.map(s=>s.id),cach:'Chỉ báo – bổ sung ở Biên mục sách',ops:[]});
  return I}

const isAdmin=()=>ROLE==='admin';

function setWho(w,nho){USER=w.user==='admin'?'':w.user||'';ROLE=w.role||'admin';HOTEN=w.hoTen||'';
  [['tv_user',USER],['tv_role',ROLE],['tv_hoten',HOTEN]].forEach(([k,v])=>{SS.set(k,v);if(nho)LS.set(k,v);else LS.del(k)})}

/* Máy chủ dùng thử: kiểm tra tài khoản giống máy chủ Google */
function localAuth(db,req){const pw=cfgOf(db.CaiDat).matKhau||'admin123';const u=String(req.user||'').trim().toLowerCase();const fail=()=>{const e=new Error('Sai tên đăng nhập hoặc mật khẩu');e.auth=true;throw e};
  if(!u||u==='admin'){if(req.pass!==pw)fail();return{user:'admin',role:'admin',hoTen:'Quản trị'}}
  const tk=(db.TaiKhoan||[]).find(t=>String(t.id).toLowerCase()===u);if(!tk||tk.khoa==='1'||tk.matKhau!=='p$'+req.pass)fail();
  return{user:tk.id,role:tk.vaiTro==='admin'?'admin':'nhanvien',hoTen:tk.hoTen}}
function localCheckOps(ops,who){if(who.role==='admin')return;for(const op of ops){if(op.t==='assert')continue;
  if(op.table==='CaiDat'&&(op.rows||[]).some(r=>r.key==='matKhau'))throw new Error('Chỉ quản trị viên được đổi mật khẩu quản trị.');
  if(op.table==='TaiKhoan')throw new Error('Tài khoản nhân viên không được sửa mục này (cần quyền quản trị).');
  if(op.t==='remove'&&['Sach','BanSach','BanDoc','MuonTra','DanhMuc','ThanhLy','KiemKe'].includes(op.table))throw new Error('Tài khoản nhân viên không được xóa dữ liệu này (cần quyền quản trị).')}}
function localPrepTK(ops){for(const op of ops){if(op.table!=='TaiKhoan'||op.t!=='upsert')continue;for(const r of op.rows){r.id=String(r.id||'').trim().toLowerCase();
  if(!/^[a-z0-9._-]{3,30}$/.test(r.id)||r.id==='admin')throw new Error('Tên đăng nhập chỉ gồm chữ không dấu, số, dấu chấm/gạch (3–30 ký tự), khác "admin"');
  if(r.matKhauMoi!==undefined){if(String(r.matKhauMoi).length<6)throw new Error('Mật khẩu tối thiểu 6 ký tự');r.matKhau='p$'+r.matKhauMoi;delete r.matKhauMoi}else delete r.matKhau}}}
async function localExtra(db,req,who){
  if(req.action==='nxbgd')throw new Error('Đọc mã QR của NXB Giáo dục cần kết nối Google Sheets (máy chủ Apps Script). Ở chế độ dùng thử hãy nhập tay.');
  if(req.action==='doiMK'){if(who.user==='admin')throw new Error('Tài khoản admin đổi mật khẩu ở Thiết lập');if(String(req.moi||'').length<6)throw new Error('Mật khẩu tối thiểu 6 ký tự');const tk=db.TaiKhoan.find(t=>t.id===who.user);tk.matKhau='p$'+req.moi;Local.save();return{ok:true}}
  if(req.action==='archive'){if(who.role!=='admin')throw new Error('Cần quyền quản trị');const tr=String(req.truoc||'');if(tr>mocLuuTru())throw new Error('Phải giữ tối thiểu '+GIU_NAM+' năm học');const res={};
    const oldM=db.MuonTra.filter(m=>m.trangThai==='Đã trả'&&m.ngayTra&&m.ngayTra<tr);db.LuuTru_MuonTra=(db.LuuTru_MuonTra||[]).concat(oldM);db.MuonTra=db.MuonTra.filter(m=>!oldM.includes(m));res.MuonTra=oldM.length;
    const ch=new Set(db.KiemKe.filter(k=>k.trangThai==='Đã chốt'&&k.ngayChot&&k.ngayChot<tr).map(k=>k.id));const oldK=db.KiemKeCT.filter(c=>ch.has(c.kiemKeId));db.KiemKeCT=db.KiemKeCT.filter(c=>!ch.has(c.kiemKeId));res.KiemKeCT=oldK.length;
    Local.save();return{ok:true,data:res}}
  return null}
